  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"311ec11c-1c1e-49f7-b234-bc53e0e71250\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ============================================================\n     COLOR · Brand ginger ramp\n     ============================================================ */\n  --opp-ginger-dark:   #B5530A;   /* Primary — CTAs, headings, \"Date\" wordmark, brand accents */\n  --opp-ginger-mid:    #D4723A;   /* Secondary — hover, gradient top, \"Warm\" pillar */\n  --opp-ginger-deep:   #8E3F05;   /* Pressed / darker ginger, \"Elevated\" pillar */\n  --opp-ginger-light:  #F5E6D8;   /* Light tint — subtle backgrounds, badges, hairlines */\n  --opp-peach:         #F2C39E;   /* Lightest peach — for the 5-band brand bar */\n\n  /* ============================================================\n     COLOR · Slate / cool secondary (NEW — from brand book v1.0)\n     The brand pairs warm ginger with cool slate, never grey.\n     ============================================================ */\n  --opp-slate-deep:    #2C4452;   /* \"Confidential\" header bar, \"Intelligent\" pillar */\n  --opp-slate:         #3E5E6C;   /* H2/H3 section headings (\"About OppDate\") */\n  --opp-slate-mid:     #6A8089;   /* Mid divider in the 5-band brand bar */\n  --opp-slate-soft:    #9FAEB4;   /* Soft grey-blue accent */\n  --opp-slate-pale:    #D7DEE1;   /* Faintest slate for hairlines on cool surfaces */\n\n  /* ============================================================\n     COLOR · Page surfaces, ink\n     ============================================================ */\n  --opp-cream:         #FAF3EA;   /* Page background — slightly warmer peach-cream */\n  --opp-cream-2:       #F3E8D9;   /* Section bands, hover row, the brand-book bg */\n  --opp-cream-deep:    #ECDBC4;   /* \"Logo lockup\" sample card background */\n  --opp-white:         #FFFFFF;\n\n  --opp-ink:           #1F3242;   /* Body text — warm-tinted dark slate, NOT pure black */\n  --opp-ink-2:         #3D5562;   /* Secondary body text */\n  --opp-mute:          #6A7B85;   /* Muted/tertiary copy */\n  --opp-line:          #E4D7C5;   /* Warm hairline border */\n  --opp-line-2:        #D6C5AC;   /* Slightly stronger warm hairline */\n  --opp-line-cool:     #D7DEE1;   /* Cool hairline for slate surfaces */\n\n  /* ============================================================\n     COLOR · Semantic state (warm-tuned)\n     ============================================================ */\n  --opp-success:       #4B7A3E;\n  --opp-success-bg:    #ECF0E4;\n  --opp-warn:          #C4881C;\n  --opp-warn-bg:       #FBF1DA;\n  --opp-error:         #A6321E;\n  --opp-error-bg:      #F7E2DC;\n  --opp-info:          #305B6E;\n  --opp-info-bg:       #E1ECF1;\n\n  /* ============================================================\n     COLOR · Semantic role tokens\n     ============================================================ */\n  --bg:                var(--opp-cream);\n  --bg-elev:           var(--opp-white);\n  --bg-band:           var(--opp-cream-2);\n  --bg-tint:           var(--opp-ginger-light);\n  --bg-dark:           var(--opp-slate-deep);\n\n  --fg:                var(--opp-ink);\n  --fg-2:              var(--opp-ink-2);\n  --fg-mute:           var(--opp-mute);\n  --fg-on-ginger:      var(--opp-white);\n  --fg-on-slate:       var(--opp-white);\n  --fg-heading-major:  var(--opp-ginger-dark);   /* H1 / numerals / hero headings */\n  --fg-heading-minor:  var(--opp-slate);          /* H2 / section heads */\n\n  --accent:            var(--opp-ginger-dark);\n  --accent-hover:      var(--opp-ginger-mid);\n  --accent-press:      var(--opp-ginger-deep);\n  --accent-cool:       var(--opp-slate-deep);\n\n  --border:            var(--opp-line);\n  --border-strong:     var(--opp-line-2);\n  --border-cool:       var(--opp-line-cool);\n\n  /* ============================================================\n     GRADIENTS · brand-mark only (very restrained use)\n     ============================================================ */\n  --opp-grad-ginger:   linear-gradient(135deg, #D4723A 0%, #B5530A 55%, #8E3F05 100%);\n  --opp-grad-cream:    linear-gradient(180deg, #FAF3EA 0%, #F3E8D9 100%);\n  --opp-band-5:        linear-gradient(90deg,\n                         #F2C39E 0% 20%,\n                         #6A8089 20% 40%,\n                         #9FAEB4 40% 60%,\n                         #C8D2D6 60% 80%,\n                         #D7DEE1 80% 100%);\n\n  /* ============================================================\n     RADIUS · 8-pt\n     ============================================================ */\n  --r-xs: 4px;\n  --r-sm: 6px;\n  --r-md: 10px;\n  --r-lg: 14px;\n  --r-xl: 20px;\n  --r-2xl: 28px;\n  --r-pill: 999px;\n\n  /* ============================================================\n     SPACING · 8-pt grid + 4 sub\n     ============================================================ */\n  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;  --sp-4: 16px;\n  --sp-5: 20px; --sp-6: 24px; --sp-7: 32px;  --sp-8: 40px;\n  --sp-9: 56px; --sp-10: 72px; --sp-11: 96px;\n\n  /* ============================================================\n     ELEVATION · warm-tinted shadows, never pure black\n     ============================================================ */\n  --shadow-xs: 0 1px 2px rgba(73, 42, 12, 0.06);\n  --shadow-sm: 0 1px 2px rgba(73, 42, 12, 0.05), 0 2px 6px rgba(73, 42, 12, 0.05);\n  --shadow-md: 0 4px 10px rgba(73, 42, 12, 0.06), 0 10px 24px rgba(73, 42, 12, 0.06);\n  --shadow-lg: 0 12px 28px rgba(73, 42, 12, 0.10), 0 24px 60px rgba(73, 42, 12, 0.08);\n  --shadow-ginger: 0 8px 24px rgba(181, 83, 10, 0.22);\n  --shadow-slate:  0 8px 24px rgba(44, 68, 82, 0.18);\n  --inset-hairline: inset 0 0 0 1px var(--opp-line);\n\n  /* ============================================================\n     MOTION\n     ============================================================ */\n  --ease-out-soft: cubic-bezier(0.22, 1, 0.36, 1);\n  --ease-in-out:   cubic-bezier(0.65, 0, 0.35, 1);\n  --dur-fast:   140ms;\n  --dur-base:   220ms;\n  --dur-slow:   420ms;\n\n  /* ============================================================\n     TYPE · families\n     OppDate uses an editorial serif for display + headings,\n     paired with a clean geometric sans for body & UI.\n     ============================================================ */\n  --font-serif:   'Fraunces', 'Playfair Display', Georgia, 'Times New Roman', serif;\n  --font-sans:    'DM Sans', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;\n  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;\n\n  /* Display family alias — keeps tokens consistent across cards that\n     reference --font-display. Points to the serif. */\n  --font-display: var(--font-serif);\n\n  /* Legacy color aliases — older UI kit code referenced --opp-charcoal*.\n     Mapped to the new ink/slate tokens. Prefer --opp-ink / --opp-ink-2 in new code. */\n  --opp-charcoal:    var(--opp-ink);\n  --opp-charcoal-2:  var(--opp-ink-2);\n\n  /* ============================================================\n     TYPE · scale (px)\n     ============================================================ */\n  --fs-display:   72px;   /* hero numbers, marketing displays */\n  --fs-h1:        56px;\n  --fs-h2:        40px;\n  --fs-h3:        28px;\n  --fs-h4:        22px;\n  --fs-h5:        18px;\n  --fs-body-lg:   18px;\n  --fs-body:      16px;\n  --fs-body-sm:   14px;\n  --fs-caption:   13px;\n  --fs-micro:     11px;\n\n  --lh-tight:    1.02;\n  --lh-snug:     1.15;\n  --lh-base:     1.55;\n  --lh-relaxed:  1.7;\n\n  --tr-tight:   -0.025em;\n  --tr-normal:   0;\n  --tr-wide:     0.02em;\n  --tr-eyebrow:  0.14em;\n}\n\n/* ============================================================\n   Base\n   ============================================================ */\nhtml, body {\n  background: var(--bg);\n  color: var(--fg);\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-base);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\n/* ============================================================\n   Semantic type classes — match the brand book voice:\n   - Big section numerals + section titles: Mulish 900, ginger\n   - Sub-section headings: Mulish 700, slate\n   - Body: Plus Jakarta Sans 400, ink (warm dark slate)\n   ============================================================ */\n\n.opp-display {\n  font-family: var(--font-serif);\n  font-optical-sizing: auto;\n  font-weight: 600;\n  font-size: var(--fs-display);\n  line-height: 0.98;\n  letter-spacing: var(--tr-tight);\n  color: var(--accent);\n}\n\n.opp-h1 {\n  font-family: var(--font-serif);\n  font-optical-sizing: auto;\n  font-weight: 600;\n  font-size: var(--fs-h1);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--tr-tight);\n  color: var(--accent);\n}\n\n.opp-h2 {\n  font-family: var(--font-serif);\n  font-weight: 600;\n  font-size: var(--fs-h2);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tr-tight);\n  color: var(--fg-heading-minor);\n}\n\n.opp-h3 {\n  font-family: var(--font-serif);\n  font-weight: 600;\n  font-size: var(--fs-h3);\n  line-height: var(--lh-snug);\n  letter-spacing: -0.01em;\n  color: var(--fg-heading-minor);\n}\n\n.opp-h4 {\n  font-family: var(--font-serif);\n  font-weight: 600;\n  font-size: var(--fs-h4);\n  line-height: 1.3;\n  color: var(--fg-heading-minor);\n}\n\n.opp-h5,\n.opp-section-title {\n  font-family: var(--font-sans);\n  font-weight: 600;\n  font-size: var(--fs-h5);\n  line-height: 1.35;\n  color: var(--fg);\n}\n\n.opp-eyebrow {\n  font-family: var(--font-sans);\n  font-weight: 600;\n  font-size: var(--fs-micro);\n  letter-spacing: var(--tr-eyebrow);\n  text-transform: uppercase;\n  color: var(--accent);\n}\n\n.opp-body-lg {\n  font-family: var(--font-sans);\n  font-size: var(--fs-body-lg);\n  line-height: var(--lh-relaxed);\n  color: var(--fg-2);\n}\n\n.opp-body {\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-base);\n  color: var(--fg);\n}\n\n.opp-caption {\n  font-family: var(--font-sans);\n  font-size: var(--fs-caption);\n  line-height: 1.45;\n  color: var(--fg-mute);\n}\n\n.opp-mono {\n  font-family: var(--font-mono);\n  font-size: 13px;\n  letter-spacing: 0;\n}\n\n/* ============================================================\n   Wordmark + monogram helpers\n   ============================================================ */\n.opp-wordmark {\n  font-family: var(--font-serif);\n  font-weight: 600;\n  letter-spacing: -0.01em;\n  line-height: 1;\n  display: inline-flex;\n  align-items: baseline;\n}\n.opp-wordmark .opp  { color: var(--opp-ink); }\n.opp-wordmark .date { color: var(--opp-ginger-dark); }\n\n.opp-monogram-gradient {\n  background: var(--opp-grad-ginger);\n  -webkit-background-clip: text;\n          background-clip: text;\n  color: transparent;\n}\n<\u002Fstyle>\n<script src=\"c0f75a17-40c3-4fea-8b74-2de75b143166\"><\u002Fscript>\n<style>\n  /* ============================================================\n     OppDate Landing - page styles\n     All tokens come from design-system/colors_and_type.css\n     ============================================================ */\n\n  *, *::before, *::after { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    background: var(--bg);\n    color: var(--fg);\n    font-family: var(--font-sans);\n    font-size: var(--fs-body);\n    line-height: var(--lh-base);\n  }\n  img { max-width: 100%; display: block; }\n  a { color: inherit; text-decoration: none; }\n  button { font: inherit; }\n\n  /* ---- Layout ---- */\n  .wrap {\n    width: 100%;\n    max-width: 1200px;\n    margin-inline: auto;\n    padding-inline: var(--sp-7);\n  }\n  section { position: relative; }\n\n  /* ---- Buttons ---- */\n  .btn {\n    display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);\n    padding: 1rem 2rem;\n    border-radius: 62.5rem;\n    font-family: var(--font-sans); font-size: 1rem; font-weight: 700;\n    line-height: 1.3rem;\n    letter-spacing: -0.005em;\n    border: 1px solid transparent;\n    cursor: pointer;\n    transition: all 0.3s;\n    white-space: nowrap;\n  }\n  .btn .lucide { width: 18px; height: 18px; }\n  .btn-primary {\n    background-color: var(--accent);\n    color: var(--fg-on-ginger);\n    box-shadow:\n      0 5px 10px rgba(181, 83, 10, 0.10),\n      0 18px 18px rgba(181, 83, 10, 0.09),\n      0 41px 25px rgba(181, 83, 10, 0.05),\n      0 73px 29px rgba(181, 83, 10, 0.01),\n      0 113px 32px rgba(0, 0, 0, 0);\n  }\n  .btn-primary:hover {\n    background-color: var(--accent-hover);\n    transform: translateY(-1px);\n    box-shadow:\n      0 6px 12px rgba(181, 83, 10, 0.14),\n      0 22px 24px rgba(181, 83, 10, 0.12),\n      0 48px 30px rgba(181, 83, 10, 0.07),\n      0 80px 34px rgba(181, 83, 10, 0.02),\n      0 120px 36px rgba(0, 0, 0, 0);\n  }\n  .btn-primary:active { background-color: var(--accent-press); transform: translateY(0); }\n  .btn-ghost {\n    background: transparent;\n    color: var(--fg);\n    border-color: var(--border-strong);\n  }\n  .btn-ghost:hover {\n    background: var(--bg-band);\n    border-color: var(--accent);\n    color: var(--accent-deep);\n  }\n  .btn-small { padding: 0.5rem 1.25rem; font-size: 0.875rem; line-height: 1.1rem; }\n  /* Nav CTA: slightly tighter padding so it fits the capsule height */\n  .btn.nav-cta { padding: 0.875rem 1.75rem; color: var(--fg-on-ginger); }\n  .btn-link {\n    color: var(--accent); font-weight: 600; display: inline-flex; align-items: center; gap: 6px;\n    background: transparent; border: 0; padding: 0; cursor: pointer; font-size: 15px;\n  }\n  .btn-link .lucide { width: 16px; height: 16px; transition: transform var(--dur-fast) var(--ease-out-soft); }\n  .btn-link:hover .lucide { transform: translateX(3px); }\n\n  /* ---- Eyebrow ---- */\n  .eyebrow {\n    font-family: var(--font-sans); font-weight: 600;\n    font-size: var(--fs-micro);\n    letter-spacing: var(--tr-eyebrow);\n    text-transform: uppercase;\n    color: var(--accent);\n    display: inline-block;\n  }\n  .eyebrow-muted { color: var(--fg-mute); }\n\n  /* ---- Design-system v1.0 sync ----\n     The brand book renamed --accent-2 → --accent-hover and\n     --accent-deep → --accent-press. Keep the legacy names alive so\n     existing usages keep resolving.\n     Also: hero-hub teal accents (intentional warm/cool tension against\n     the ginger monogram). Tokenised so they're easy to retune. */\n  :root {\n    /* ---- Brand colour update v2 (May 2026) ----\n       Primary ginger darkened for a more authoritative tone.\n       These override the design-system tokens for THIS page only,\n       so every --accent / heading / CTA usage picks up the new value.\n       Old primary #B5530A → #8B3D07 ; old mid #D4723A → #C4631E.\n       The hero network map keeps its v1 glow (hard-coded rgba). */\n    --opp-ginger-dark: #7A2D05;\n    --opp-ginger-mid:  #B5520F;\n    --opp-ginger-deep: #6E2F04;\n    --opp-grad-ginger: linear-gradient(135deg, #B5520F 0%, #7A2D05 55%, #6E2F04 100%);\n\n    --accent-2:    var(--accent-hover);\n    --accent-deep: var(--accent-press);\n\n    --opp-teal-deep:  #0E7490;\n    --opp-teal-mid:   #1796B3;\n    --opp-teal-light: #5BA8BC;\n    --opp-grad-teal:  linear-gradient(135deg, #1796B3 0%, #0E7490 55%, #0A5A72 100%);\n  }\n\n  /* ---- Typography helpers ----\n     Heading colour rule (README v1.0):\n     • H1 / display → ink by default; ginger reserved for the brand promise,\n       hero numerals, and the \"Date\" wordmark.\n     • H2 / H3 → ink on product surfaces, slate (--fg-heading-minor) on\n       marketing / section-band contexts. This is a marketing page, so .h-2\n       and .h-3 ship in slate. */\n  .h-display { font-family: var(--font-serif); font-weight: 600; font-size: clamp(48px, 5vw, 60px);\n               line-height: 1.02; letter-spacing: -0.02em; font-optical-sizing: auto;\n               margin: 0; text-wrap: balance; color: var(--fg); }\n  .h-1 { font-family: var(--font-serif); font-weight: 600; font-size: clamp(38px, 4.6vw, 56px);\n         line-height: 1.06; letter-spacing: var(--tr-tight); font-optical-sizing: auto; margin: 0; text-wrap: balance;\n         color: var(--fg); }\n  .h-2 { font-family: var(--font-serif); font-weight: 600; font-size: clamp(30px, 3.4vw, 40px);\n         line-height: 1.1; letter-spacing: var(--tr-tight); font-optical-sizing: auto; margin: 0; text-wrap: balance;\n         color: var(--fg-heading-minor); }\n  .h-3 { font-family: var(--font-serif); font-weight: 600; font-size: 24px; line-height: 1.18; letter-spacing: -0.01em; margin: 0;\n         color: var(--fg-heading-minor); }\n  .lede { font-family: var(--font-sans); font-size: var(--fs-body-lg); line-height: var(--lh-relaxed);\n          color: var(--fg-2); margin: 0; max-width: 56ch; text-wrap: pretty; }\n  .body { color: var(--fg-2); line-height: var(--lh-relaxed); margin: 0; text-wrap: pretty; }\n\n  /* ============================================================\n     1. Announcement bar\n     ============================================================ */\n  .announce {\n    background: var(--accent);\n    color: var(--fg-on-ginger);\n    text-align: center;\n    font-size: var(--fs-body-sm);\n    font-weight: 500;\n    padding: 10px var(--sp-6);\n    letter-spacing: 0.01em;\n  }\n  .announce a {\n    color: var(--fg-on-ginger);\n    border-bottom: 1px solid rgba(255,255,255,0.4);\n    padding-bottom: 1px;\n    margin-left: 6px;\n    font-weight: 600;\n    transition: border-color var(--dur-fast) var(--ease-out-soft);\n  }\n  .announce a:hover { border-color: var(--fg-on-ginger); }\n\n  /* ============================================================\n     2. Navigation - floating white card with mega-menu dropdowns\n     ============================================================ */\n  .nav {\n    position: sticky; top: 0; z-index: 60;\n    padding: 12px 12px 0;\n    background: transparent;\n    transition: padding var(--dur-base) var(--ease-out-soft);\n  }\n  .nav.scrolled { padding-top: 8px; }\n  .nav-inner {\n    width: 100%;\n    max-width: 1280px;\n    margin: 0 auto;\n    backdrop-filter: blur(40px);\n    -webkit-backdrop-filter: blur(40px);\n    background-color: rgba(255, 255, 255, 0.30);\n    border-top: 1px solid rgba(255, 255, 255, 0.85);\n    border-radius: 62.5rem;\n    box-shadow: 0 20px 28px rgba(181, 83, 10, 0.10);\n    padding: 0.75rem 0.75rem 0.75rem 2rem;\n    display: flex; align-items: center; justify-content: space-between;\n    gap: var(--sp-7);\n    transition: box-shadow var(--dur-base) var(--ease-out-soft);\n  }\n  .nav.scrolled .nav-inner {\n    box-shadow: 0 24px 36px rgba(181, 83, 10, 0.14);\n  }\n  .nav-logo {\n    display: inline-flex; align-items: center; gap: 10px;\n    font-family: var(--font-serif); font-weight: 600; font-size: 22px;\n    letter-spacing: -0.01em;\n    flex-shrink: 0;\n  }\n  .nav-logo .mark { width: 48px; height: 48px; }\n  .nav-logo .opp { color: var(--opp-charcoal); }\n  .nav-logo .date { color: var(--opp-ginger-dark); }\n\n  .nav-links {\n    display: flex; align-items: center; gap: var(--sp-6);\n    list-style: none; margin: 0; padding: 0;\n    flex-wrap: nowrap;\n  }\n  .nav-links > li { position: relative; }\n  .nav-links a, .nav-links a:visited, .nav-links .nav-trigger {\n    font-family: var(--font-sans);\n    font-size: 14.5px; font-weight: 500; color: var(--opp-charcoal-2);\n    background: transparent; border: 0; cursor: pointer;\n    display: inline-flex; align-items: center; gap: 5px;\n    padding: 8px 0;\n    white-space: nowrap;\n    transition: color var(--dur-fast) var(--ease-out-soft);\n  }\n  .nav-links a:hover, .nav-links .nav-trigger:hover,\n  .nav-links li.open .nav-trigger { color: var(--accent); }\n  .nav-links .nav-trigger .chev {\n    width: 14px; height: 14px; transition: transform var(--dur-base) var(--ease-out-soft);\n    color: currentColor; flex-shrink: 0;\n  }\n  .nav-links li.open .nav-trigger .chev { transform: rotate(180deg); }\n\n  .nav-actions { display: flex; align-items: center; gap: var(--sp-3); }\n  .nav-ghost {\n    font-size: 14.5px; font-weight: 500; color: var(--opp-charcoal);\n    padding: 8px 12px; border-radius: 8px;\n    white-space: nowrap;\n    transition: color var(--dur-fast) var(--ease-out-soft);\n  }\n  .nav-ghost:hover { color: var(--accent); }\n  /* Nav CTA inherits the global .btn / .btn-primary pill + shadow stack */\n\n  /* ---- Mega-menu dropdown ---- */\n  .nav-mega-host { position: relative; }\n  .nav-mega {\n    position: absolute;\n    top: calc(100% + 12px);\n    left: 0;\n    transform: translateY(-6px);\n    background: var(--opp-ink);\n    color: var(--opp-white);\n    border-radius: 16px;\n    border-top: 1px solid rgba(255, 255, 255, 0.10);\n    box-shadow:\n      0 18px 48px rgba(28, 28, 28, 0.35),\n      0 4px 16px rgba(181, 83, 10, 0.12);\n    padding: 16px 18px 32px;\n    width: 580px;\n    min-width: 580px;\n    height: auto;\n    max-height: none;\n    overflow: visible;\n    display: grid;\n    grid-template-columns: 260px 320px;\n    gap: 18px;\n    opacity: 0; visibility: hidden; pointer-events: none;\n    transition: opacity var(--dur-base) var(--ease-out-soft),\n                transform var(--dur-base) var(--ease-out-soft),\n                visibility 0s linear var(--dur-base);\n    z-index: 70;\n  }\n  /* Invisible bridge so the cursor can travel from trigger to panel without closing */\n  .nav-mega::before {\n    content: \"\"; position: absolute;\n    top: -16px; left: 0; right: 0; height: 16px;\n  }\n  .nav-mega-host.open .nav-mega,\n  .nav-mega:hover {\n    opacity: 1; visibility: visible; pointer-events: auto;\n    transform: translateY(0);\n    transition: opacity var(--dur-base) var(--ease-out-soft),\n                transform var(--dur-base) var(--ease-out-soft),\n                visibility 0s linear 0s;\n  }\n  /* Compact single-column mega (Other Services) */\n  .nav-mega.nav-mega-compact {\n    width: 244px; min-width: 244px;\n    grid-template-columns: 1fr;\n    padding: 16px 14px 18px;\n    left: auto; right: 0;\n  }\n\n  .mega-col-title {\n    font-family: var(--font-sans); font-weight: 600;\n    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;\n    color: rgba(255, 255, 255, 0.42);\n    margin: 0 0 8px;\n  }\n\n  .mega-items {\n    list-style: none; margin: 0; padding: 0;\n    display: flex; flex-direction: column; gap: 2px;\n  }\n  .mega-item {\n    display: flex; align-items: center; justify-content: space-between;\n    gap: 10px;\n    padding: 8px 10px;\n    border-radius: 8px;\n    color: #fff;\n    transition: background var(--dur-fast) var(--ease-out-soft);\n    position: relative;\n    width: 100%;\n    box-sizing: border-box;\n  }\n  .mega-item .mi-lead {\n    display: inline-flex; align-items: center; gap: 10px;\n    min-width: 0; flex: 1;\n  }\n  .mega-item:hover { background: rgba(255, 255, 255, 0.06); }\n  .mega-item .mi-ic {\n    width: 28px; height: 28px; border-radius: 8px;\n    background: rgba(255, 255, 255, 0.06);\n    display: inline-flex; align-items: center; justify-content: center;\n    color: var(--opp-ginger-mid);\n    transition: background var(--dur-fast) var(--ease-out-soft), color var(--dur-fast) var(--ease-out-soft);\n  }\n  .mega-item:hover .mi-ic {\n    background: rgba(181, 83, 10, 0.18);\n    color: var(--opp-ginger-light);\n  }\n  .mega-item .mi-ic .lucide { width: 15px; height: 15px; stroke-width: 1.85; }\n  .mega-item .mi-title {\n    font-family: var(--font-sans); font-weight: 600;\n    font-size: 13.5px; color: var(--opp-white); line-height: 1.25;\n    white-space: nowrap;\n  }\n  .mega-item .mi-arrow {\n    width: 14px; height: 14px;\n    color: rgba(255, 255, 255, 0.30);\n    transition: color var(--dur-fast) var(--ease-out-soft), transform var(--dur-fast) var(--ease-out-soft);\n  }\n  .mega-item:hover .mi-arrow {\n    color: var(--opp-ginger-mid);\n    transform: translateX(2px);\n  }\n  .mega-item.disabled .mi-title { color: rgba(255, 255, 255, 0.40); }\n  .mega-item.disabled .mi-ic {\n    background: rgba(255, 255, 255, 0.04);\n    color: rgba(255, 255, 255, 0.35);\n  }\n  .mega-item.disabled:hover { background: transparent; cursor: default; }\n  .mega-item.disabled:hover .mi-ic {\n    background: rgba(255, 255, 255, 0.04);\n    color: rgba(255, 255, 255, 0.35);\n  }\n  .mega-item.disabled .mi-arrow { display: none; }\n  .mega-item .soon-pill {\n    font-size: 9px; font-weight: 700;\n    padding: 3px 8px; border-radius: 999px;\n    background: var(--accent); color: var(--fg-on-ginger);\n    letter-spacing: 0.10em; text-transform: uppercase;\n    line-height: 1;\n    align-self: center;\n  }\n\n  /* Right column - context links */\n  .mega-side { display: flex; flex-direction: column; gap: 14px; padding-top: 2px; }\n  .mega-side-group .mega-col-title { margin-bottom: 6px; }\n  .mega-side-group .mega-list {\n    list-style: none; margin: 0; padding: 0;\n    display: flex; flex-wrap: wrap;\n  }\n  .mega-side-group .mega-list li {\n    font-size: 12.5px;\n    color: rgba(255,255,255,0.78);\n    font-weight: 400;\n    line-height: 1.5;\n  }\n  .mega-side-group .mega-list li:not(:last-child)::after {\n    content: \"·\";\n    margin: 0 7px;\n    color: rgba(255,255,255,0.28);\n  }\n  .mega-side-group .mega-list a {\n    color: inherit; padding: 0;\n    transition: color var(--dur-fast) var(--ease-out-soft);\n  }\n  .mega-side-group .mega-list a:hover { color: var(--opp-ginger-mid); }\n\n  .mega-side-group.popular .mega-list { flex-direction: column; gap: 5px; }\n  .mega-side-group.popular .mega-list li::after { content: none; }\n  .mega-side-group.popular .mega-list a {\n    display: inline-flex; align-items: center; gap: 7px;\n    font-size: 13px; font-weight: 500; color: var(--opp-white);\n  }\n  .mega-side-group.popular .mega-list a::before {\n    content: \"→\"; color: var(--opp-ginger-mid); font-size: 12px;\n  }\n  .mega-side-group.popular .mega-list a:hover { color: var(--opp-ginger-light); }\n\n  /* ============================================================\n     3. Hero\n     ----- HERO NETWORK LOCKED ------------------------------------\n     The hero (.hero, .hero-visual, .hub, .node, .lines, world-map\n     SVG dot pattern, and connecting-line generator) is FROZEN as\n     of the user's sign-off. Do not change sizes, colors, glow\n     stops, line weights, or node positions without explicit\n     instructions referencing the hero by name.\n     -------------------------------------------------------------- */\n  .hero {\n    min-height: calc(100vh - 110px);\n    padding: var(--sp-10) 0 var(--sp-11);\n    display: flex; align-items: center;\n    position: relative;\n    overflow: hidden;\n  }\n  /* Mesh gradient - sibling layer behind hero content. The locked\n     .hero-visual::before wash sits on top of this and is unaffected. */\n  .hero-mesh {\n    position: absolute; inset: 0;\n    width: 100%; height: 100%;\n    z-index: 0;\n    pointer-events: none;\n    display: block;\n  }\n  .hero > .wrap { position: relative; z-index: 1; }\n  .hero-grid {\n    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);\n    gap: clamp(var(--sp-10), 9vw, 128px); align-items: center;\n    width: 100%;\n  }\n  .hero-eyebrow { margin-bottom: var(--sp-5); }\n  .hero h1 { margin-bottom: var(--sp-6); max-width: 16ch; }\n  .hero .hero-h1 { font-size: clamp(33px, 5.2vw, 58px); }\n  .hero h1 .hl-1 { display: block; color: var(--fg); }\n  .hero h1 .accent {\n    display: block;\n    color: var(--accent);\n    font-style: italic;\n    font-weight: 700;\n  }\n  .hero-sub { margin-bottom: var(--sp-9); max-width: 46ch; }\n  .hero-ctas { display: flex; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-8); }\n  .trust-row {\n    display: flex; align-items: center; gap: var(--sp-6); flex-wrap: wrap;\n    color: var(--fg-mute); font-size: var(--fs-body-sm); font-weight: 500;\n  }\n  .trust-row .item { display: inline-flex; align-items: center; gap: 8px; }\n  .trust-row .lucide { width: 16px; height: 16px; color: var(--accent); stroke-width: 1.75; }\n  .trust-row .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--opp-line-2); }\n\n  /* ---- Hero network visual ---- */\n  .hero-visual {\n    position: relative;\n    aspect-ratio: 1 / 1;\n    max-width: 640px;\n    margin-left: auto;\n    width: 100%;\n  }\n  .hero-visual svg.bg-map {\n    position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.42;\n    pointer-events: none;\n  }\n  .hero-visual svg.lines {\n    position: absolute; inset: 0; width: 100%; height: 100%;\n    pointer-events: none;\n  }\n  /* radial warm wash behind everything */\n  .hero-visual::before {\n    content: \"\"; position: absolute; inset: -8%;\n    background: radial-gradient(circle at 50% 50%,\n      rgba(245, 230, 216, 0.7) 0%,\n      rgba(245, 230, 216, 0.2) 35%,\n      rgba(250, 247, 244, 0) 65%);\n    pointer-events: none;\n  }\n  .hub {\n    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);\n    width: 144px; height: 144px;\n    border-radius: 50%;\n    background: #2C1A0E;\n    display: flex; align-items: center; justify-content: center;\n    box-shadow:\n      0 0 0 8px rgba(181, 83, 10, 0.22),\n      0 0 0 20px rgba(181, 83, 10, 0.14),\n      0 0 0 40px rgba(181, 83, 10, 0.07),\n      0 0 0 64px rgba(181, 83, 10, 0.03),\n      0 22px 48px rgba(44, 26, 14, 0.40),\n      0 0 60px rgba(181, 83, 10, 0.25);\n    z-index: 3;\n    animation: hub-pulse 3.6s var(--ease-in-out) infinite;\n  }\n  @keyframes hub-pulse {\n    0%, 100% { box-shadow:\n      0 0 0 8px rgba(181, 83, 10, 0.22),\n      0 0 0 20px rgba(181, 83, 10, 0.14),\n      0 0 0 40px rgba(181, 83, 10, 0.07),\n      0 0 0 64px rgba(181, 83, 10, 0.03),\n      0 22px 48px rgba(44, 26, 14, 0.40),\n      0 0 60px rgba(181, 83, 10, 0.25); }\n    50%      { box-shadow:\n      0 0 0 12px rgba(181, 83, 10, 0.26),\n      0 0 0 28px rgba(181, 83, 10, 0.14),\n      0 0 0 54px rgba(181, 83, 10, 0.06),\n      0 0 0 82px rgba(181, 83, 10, 0.02),\n      0 26px 56px rgba(44, 26, 14, 0.44),\n      0 0 90px rgba(181, 83, 10, 0.35); }\n  }\n  .hub img { width: 78%; height: auto; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15)); }\n\n  .node {\n    position: absolute;\n    transform: translate(-50%, -50%);\n    background: linear-gradient(180deg, #FFFCF8 0%, var(--opp-cream-2) 100%);\n    border: 1px solid rgba(181, 83, 10, 0.32);\n    border-radius: var(--r-pill);\n    padding: 11px 18px 11px 13px;\n    font-family: var(--font-sans); font-size: 14px; font-weight: 600;\n    color: var(--fg);\n    box-shadow:\n      0 8px 18px rgba(142, 63, 5, 0.14),\n      0 2px 4px rgba(142, 63, 5, 0.10),\n      inset 0 0 0 1px rgba(255, 255, 255, 0.6);\n    display: inline-flex; align-items: center; gap: 10px;\n    white-space: nowrap;\n    z-index: 2;\n    animation: node-float 6s var(--ease-in-out) infinite;\n    transition: transform var(--dur-base) var(--ease-out-soft), box-shadow var(--dur-base) var(--ease-out-soft), border-color var(--dur-base) var(--ease-out-soft);\n  }\n  .node:hover {\n    border-color: var(--accent);\n    box-shadow:\n      0 10px 24px rgba(142, 63, 5, 0.20),\n      0 2px 6px rgba(142, 63, 5, 0.12),\n      0 0 0 3px rgba(181, 83, 10, 0.16);\n  }\n  .node .nico {\n    width: 26px; height: 26px; border-radius: 50%;\n    background: var(--opp-grad-ginger);\n    display: inline-flex; align-items: center; justify-content: center;\n    color: #fff;\n    box-shadow: 0 2px 6px rgba(142, 63, 5, 0.30);\n  }\n  .node .nico .lucide { width: 14px; height: 14px; stroke-width: 2; }\n  @keyframes node-float {\n    0%, 100% { translate: 0 0; }\n    50%      { translate: 0 -4px; }\n  }\n  /* Stagger floats so they don't all bob in unison */\n  .node:nth-child(odd)  { animation-delay: -1.4s; }\n  .node:nth-child(3n)   { animation-delay: -2.8s; }\n  .node:nth-child(5n)   { animation-delay: -0.7s; }\n\n  /* line dash animation */\n  .lines path { fill: none; stroke-linecap: round; }\n  .lines .flow {\n    stroke-dasharray: 2.5 7;\n    animation: flow 2.4s linear infinite;\n  }\n  @keyframes flow {\n    to { stroke-dashoffset: -22; }\n  }\n\n  /* ============================================================\n     4. Social proof strip\n     ============================================================ */\n  .benefits {\n    background: var(--bg);\n    padding: var(--sp-11) 0;\n    border-top: 1px solid var(--border);\n    border-bottom: 1px solid var(--border);\n    overflow: hidden;\n  }\n  .benefits-head { text-align: center; margin: 0 auto var(--sp-9); max-width: 760px; }\n  .benefits-head h2 { margin: 0 auto var(--sp-4); }\n  .benefits-head .lede { margin: 0 auto; max-width: 52ch; }\n\n  .benefits-carousel {\n    max-width: 1200px;\n    margin-inline: auto;\n    padding-inline: var(--sp-7);\n    display: flex; align-items: center; gap: var(--sp-4);\n  }\n  .bc-viewport { flex: 1; overflow: hidden; padding: 6px 0; }\n  .bc-track {\n    display: flex; gap: 20px;\n    cursor: grab;\n    touch-action: pan-y;\n    transition: transform var(--dur-slow) var(--ease-out-soft);\n    will-change: transform;\n  }\n  .bc-track.is-dragging { cursor: grabbing; transition: none; }\n  .bc-track.is-dragging .benefit-card { pointer-events: none; }\n\n  .benefit-card {\n    flex: 0 0 calc((100% - 40px) / 3);\n    box-sizing: border-box;\n    background: var(--opp-white);\n    border: 1px solid var(--opp-ginger-light);\n    border-radius: 16px;\n    padding: 24px;\n    min-height: 208px;\ m.open .faq-q .ic::after { transform: rotate(90deg); }\n  .faq-item.open .faq-q .ic { background: var(--accent); color: #fff; }\n  .faq-a {\n    display: grid;\n    grid-template-rows: 0fr;\n    transition: grid-template-rows 360ms var(--ease-out-soft);\n  }\n  .faq-a > .inner {\n    overflow: hidden;\n    color: rgba(255, 255, 255, 0.62);\n    font-size: 15px; line-height: 1.65;\n    padding: 0 60px 0 4px;\n  }\n  .faq-item.open .faq-a {\n    grid-template-rows: 1fr;\n  }\n  .faq-item.open .faq-a > .inner {\n    padding-bottom: 24px;\n  }\n\n  /* ---- FAQ: mobile single-column stack (desktop layout untouched) ---- */\n  @media (max-width: 767px) {\n    .faq { padding: 48px 0; }\n    .faq .wrap { padding-inline: 20px; }\n    .faq-grid { display: flex; flex-direction: column; gap: 0; }\n    /* Lift .faq-left's children into the single-column flow so the\n       \"Still have questions?\" block can sit BELOW the accordion. */\n    .faq-left { display: contents; }\n    .faq-left .eyebrow { order: 1; margin-bottom: 12px; }\n    .faq-left h2 { order: 2; font-size: 28px; line-height: 1.1; margin: 0 0 12px; }\n    .faq-left .lede { order: 3; font-size: 14px; max-width: none; margin: 0 0 24px; }\n    .faq-list { order: 4; }\n    .faq-help { order: 5; margin-top: 24px; padding-top: 24px; }\n\n    .faq-q {\n      gap: 16px;\n      padding: 15px 2px;\n      min-height: 48px;\n      font-size: 15px;\n      line-height: 1.35;\n    }\n    .faq-q .ic { width: 24px; height: 24px; }\n    .faq-a > .inner {\n      font-size: 14px; line-height: 1.6;\n      padding: 0 6px 0 2px;\n      color: rgba(255, 255, 255, 0.66);\n    }\n    .faq-item.open .faq-a > .inner { padding-bottom: 12px; }\n  }\n\n  /* ============================================================\n     10. Final CTA\n     ============================================================ */\n  .final {\n    padding: var(--sp-11) 0;\n    text-align: center;\n    position: relative;\n    overflow: hidden;\n  }\n  /* Centred light-ginger bloom - symmetric, draws the eye to the headline. */\n  .final::before {\n    content: \"\";\n    position: absolute;\n    left: 50%; top: 50%;\n    transform: translate(-50%, -50%);\n    width: min(1180px, 92%);\n    aspect-ratio: 1.7 / 1;\n    background:\n      radial-gradient(ellipse at center,\n        rgba(245, 230, 216, 0.85) 0%,\n        rgba(245, 230, 216, 0.45) 28%,\n        rgba(245, 230, 216, 0.14) 55%,\n        rgba(250, 247, 244, 0) 75%),\n      radial-gradient(ellipse 60% 50% at 50% 50%,\n        rgba(212, 114, 58, 0.06) 0%,\n        rgba(212, 114, 58, 0) 70%);\n    pointer-events: none;\n    z-index: 0;\n  }\n  .final > .wrap { position: relative; z-index: 1; }\n  .final h2 { margin-bottom: var(--sp-5); max-width: 18ch; margin-inline: auto; }\n  .final p.lede { margin-inline: auto; margin-bottom: var(--sp-8); }\n  .final .ctas { display: inline-flex; gap: var(--sp-3); flex-wrap: wrap; justify-content: center; margin-bottom: var(--sp-5); }\n  .final .fine { font-size: 13px; color: var(--fg-mute); }\n\n  /* ============================================================\n     11. Footer - two-layer floating card structure\n     ============================================================ */\n  .footer {\n    background: var(--bg-dark);\n    color: var(--opp-slate-soft);\n    padding: 32px 32px 32px;\n  }\n  .footer-card {\n    background: var(--opp-ink);\n    border-radius: 20px;\n    padding: 48px;\n    margin: 0 auto;\n    max-width: 1280px;\n  }\n  .footer-card-top {\n    display: grid;\n    grid-template-columns: 1.1fr repeat(4, 1fr) 1.25fr;\n    gap: 32px;\n    align-items: start;\n  }\n  .footer-card .footer-brand-col {\n    display: flex; flex-direction: column; align-items: flex-start; gap: 16px;\n  }\n  .footer-card .footer-brand-col .mark {\n    width: 56px; height: 56px;\n    filter: drop-shadow(0 4px 10px rgba(212, 114, 58, 0.25));\n  }\n  .footer-card .lockup {\n    font-family: var(--font-serif); font-weight: 600;\n    font-size: 30px; y: block; }\n  .nav-burger[aria-expanded=\"true\"] { color: var(--accent); }\n\n  .m-menu {\n    position: fixed;\n    left: 0; right: 0;\n    top: var(--mnav-top, 84px);\n    bottom: 0;\n    z-index: 55;\n    background: rgba(28, 22, 14, 0);\n    pointer-events: none;\n    opacity: 0;\n    transition: background var(--dur-base) var(--ease-out-soft),\n                opacity var(--dur-base) var(--ease-out-soft);\n  }\n  .m-menu.open {\n    pointer-events: auto;\n    opacity: 1;\n  }\n  /* Liquid-glass slide-down dropdown panel anchored beneath the navbar. */\n  .m-menu-panel {\n    position: absolute;\n    top: 0; left: 0; right: 0;\n    margin-left: 1rem;\n    margin-right: 1rem;\n    height: calc(100dvh - var(--mnav-top, 120px) - 12px);\n    background-color: rgba(250, 247, 244, 0.85);\n    -webkit-backdrop-filter: blur(60px);\n    backdrop-filter: blur(60px);\n    border-radius: 12px;\n    border: 1px solid rgba(255, 255, 255, 0.55);\n    box-shadow: 0 20px 28px rgba(139, 61, 7, 0.14);\n    padding: 0.625rem 0.75rem 2rem;\n    display: flex;\n    flex-direction: column;\n    overflow: hidden;\n    opacity: 0;\n    transform: translateY(-10px);\n    visibility: hidden;\n    transition: opacity 250ms var(--ease-out-soft),\n                transform 250ms var(--ease-out-soft),\n                visibility 0s linear 250ms;\n  }\n  .m-menu.open .m-menu-panel {\n    opacity: 1;\n    transform: translateY(0);\n    visibility: visible;\n    transition: opacity 250ms var(--ease-out-soft),\n                transform 250ms var(--ease-out-soft),\n                visibility 0s linear 0s;\n  }\n  .m-menu-bar {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    padding: 18px 22px 14px;\n    flex-shrink: 0;\n  }\n  .m-menu-logo {\n    display: inline-flex; align-items: center; gap: 8px;\n    font-family: var(--font-serif); font-weight: 600;\n    font-size: 22px; letter-spacing: -0.01em;\n    color: var(--opp-ink);\n  }\n  .m-menu-logo img { width: 40px; height: 40px; object-fit: contain; }\n  .m-menu-logo .opp { color: var(--opp-ink); }\n  .m-menu-logo .date { color: var(--accent); }\n  .m-menu-close {\n    width: 44px; height: 44px; border-radius: 50%;\n    border: 0; background: transparent;\n    display: inline-flex; align-items: center; justify-content: center;\n    color: var(--opp-ink); cursor: pointer;\n  }\n  .m-menu-close:active { background: rgba(28,28,28,0.06); }\n  .m-menu-close svg { width: 22px; height: 22px; }\n  .m-menu-scroll {\n    flex: 1 1 auto;\n    min-height: 0;\n    overflow-y: auto;\n    overflow-x: hidden;\n    padding: 6px 4px 0;\n    -webkit-overflow-scrolling: touch;\n    scrollbar-width: thin;\n    scrollbar-color: rgba(139, 61, 7, 0.28) transparent;\n    overscroll-behavior: contain;\n  }\n  .m-menu-scroll::-webkit-scrollbar { width: 5px; }\n  .m-menu-scroll::-webkit-scrollbar-track { background: transparent; }\n  .m-menu-scroll::-webkit-scrollbar-thumb {\n    background: rgba(139, 61, 7, 0.22);\n    border-radius: 999px;\n  }\n  .m-menu-scroll::-webkit-scrollbar-thumb:hover { background: rgba(139, 61, 7, 0.38); }\n  .m-menu-foot { flex-shrink: 0; padding: 0 4px; }\n  .m-menu-nav { padding: 0; }\n  .m-menu-row {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    width: 100%;\n    padding: 18px 4px;\n    background: transparent;\n    border: 0;\n    border-bottom: 1px solid rgba(28,28,28,0.06);\n    text-align: left;\n    font-family: var(--font-sans);\n    cursor: pointer;\n    color: var(--opp-ink);\n    text-decoration: none;\n  }\n  .m-menu-row.first { border-top: 1px solid rgba(28,28,28,0.06); }\n  .m-menu-row .label {\n    font-size: 17px; font-weight: 500; letter-spacing: -0.005em;\n    color: var(--opp-ink);\n  }\n  .m-menu-row .toggle {\n    display: inline-flex; align-items: center; justify-content: center;\n    width: 26px; height: 26px;\n    color: #6B6660;\n    transition: transform var(--dur-fast) var(--ease-out-soft),\n     .hub { width: 102px; height: 102px; }\n    .node { font-size: 11px; padding: 7px 11px 7px 8px; }\n    .node .nico { width: 18px; height: 18px; }\n    .quote { padding: var(--sp-7) var(--sp-6) var(--sp-5); }\n    .quote p { font-size: 18px; }\n    .story-card { flex: 0 0 calc(100% - 32px); padding: 24px; }\n    .carousel-foot { flex-direction: column; align-items: flex-start; gap: var(--sp-4); }\n  }\n\n  /* ============================================================\n     4. WHY OPPDATE — Part A static header + Part B immersive showcase\n     (replaces the old benefit-card carousel)\n     ============================================================ */\n  /* ---- Part A: static header on cream ---- */\n  .why-section { background: var(--bg); padding: var(--sp-11) 0 0; }\n  .why-head { text-align: center; max-width: 760px; margin-inline: auto; padding-bottom: 48px; }\n  .why-head h2 {\n    font-family: var(--font-serif); font-weight: 700;\n    font-size: 48px; line-height: 1.05; letter-spacing: -0.02em;\n    color: #1C1C1C; margin: 0 0 16px; text-wrap: balance;\n    font-optical-sizing: auto;\n  }\n  .why-head p {\n    font-family: var(--font-sans); font-size: 18px; line-height: 1.6;\n    color: #6B6660; margin: 0 auto; max-width: 54ch; text-wrap: pretty;\n  }\n\n  /* ---- Part B: immersive showcase — contained, fixed-height, auto-rotating ---- */\n  .showcase { position: relative; width: 100%; height: 560px; background: #1A0F08; overflow: hidden; }\n  .showcase-scroll { position: relative; height: 100%; }\n  .showcase-sticky {\n    position: relative; height: 100%;\n    overflow: hidden;\n    display: flex; align-items: center; justify-content: center;\n  }\n  /* mesh gradient — three soft ginger blooms over the dark amber base */\n  .showcase-bg {\n    position: absolute; inset: 0; pointer-events: none; z-index: 0;\n    background:\n      radial-gradient(58% 60% at 65% 40%, rgba(122, 45, 5, 0.15), rgba(122, 45, 5, 0) 70%),\n      radial-gradient(46% 48% at 15% 80%, rgba(181, 82, 15, 0.10), rgba(181, 82, 15, 0) 70%),\n      radial-gradient(30% 32% at 5% 10%, rgba(122, 45, 5, 0.08), rgba(122, 45, 5, 0) 70%);\n  }\n  /* faint grain/vignette so embers read as depth, not flat black */\n  .showcase-bg::after {\n    content: \"\"; position: absolute; inset: 0;\n    background: radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%);\n  }\n\n  .showcase-stage {\n    position: relative; z-index: 1;\n    width: 100%; max-width: 760px; height: 100%;\n  }\n  .benefit-slide {\n    position: absolute; inset: 0;\n    display: flex; flex-direction: column; align-items: center; justify-content: center;\n    gap: 20px; padding: 40px 24px 64px;\n    opacity: 0; pointer-events: none;\n    transition: opacity 0.6s ease;\n  }\n  .benefit-slide.is-active { opacity: 1; }\n  .benefit-slide h3 {\n    font-family: var(--font-serif); font-weight: 700;\n    font-size: 38px; line-height: 1.08; letter-spacing: -0.018em;\n    color: #FFFFFF; text-align: center; margin: 0; max-width: 18ch; text-wrap: balance;\n    font-optical-sizing: auto;\n  }\n  .benefit-desc {\n    font-family: var(--font-sans); font-size: 16px; line-height: 1.6;\n    color: #F5E6D8; text-align: center; margin: 0; max-width: 480px; text-wrap: pretty;\n    opacity: 0.92;\n  }\n\n  /* ---- the liquid glass panel ---- */\n  .glass {\n    width: 480px; height: 320px; flex-shrink: 0;\n    border-radius: 20px; padding: 12px;\n    background: rgba(250, 247, 244, 0.08);\n    -webkit-backdrop-filter: blur(40px) saturate(180%);\n    backdrop-filter: blur(40px) saturate(180%);\n    border: 1px solid rgba(250, 247, 244, 0.15);\n    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.40), 0 0 0 0.5px rgba(250, 247, 244, 0.10);\n  }\n  .glass-inner {\n    --mk-scale: 1;\n    position: relative; width: 100%; height: 100%;\n    border-radius: 12px; overflow: hidden;\n    background: var(--opp-cream);\n    box-shadow: inset 0 0 0 1px rgba(28,28,28,0.05);\n  }\n\n  /* ---- showcase chrome: dots, progress (display only, no interaction) ---- */\n  .showcase-dots {\n    position: absolute; bottom: 38px; left: 50%; transform: translateX(-50%); z-index: 6;\n    display: flex; align-items: center; gap: 9px; max-width: 80%; flex-wrap: wrap; justify-content: center;\n  }\n  .showcase-dots span {\n    width: 7px; height: 7px; border-radius: 50%;\n    background: rgba(245, 230, 216, 0.28);\n    transition: background 0.3s var(--ease-out-soft), width 0.3s var(--ease-out-soft), height 0.3s var(--ease-out-soft);\n  }\n  .showcase-dots span.active { background: #B5520F; width: 10px; height: 10px; }\n  .showcase-progress {\n    position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; z-index: 6;\n    background: rgba(245, 230, 216, 0.08);\n  }\n  .showcase-progress span {\n    display: block; height: 100%; width: 0%;\n    background: linear-gradient(90deg, #7A2D05, #B5520F);\n  }\n\n  /* ============================================================\n     Showcase mockups (sc- prefix; canonical 456×296 design frame,\n     scaled to fit the glass-inner via --mk-scale)\n     ============================================================ */\n  .sc-frame {\n    position: absolute; top: 0; left: 0;\n    width: 456px; height: 296px;\n    transform-origin: top left; transform: scale(var(--mk-scale, 1));\n    background: var(--opp-cream); color: var(--opp-ink);\n    font-family: var(--font-sans); box-sizing: border-box;\n    padding: 22px; display: flex; flex-direction: column; overflow: hidden;\n  }\n  .sc-frame * { box-sizing: border-box; }\n  .sc-tt { font-family: var(--font-serif); font-weight: 600; font-size: 18px; letter-spacing: -0.01em; color: var(--opp-ink); }\n  .sc-sub { font-size: 12px; color: var(--opp-mute); }\n  .sc-hrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n  .sc-i { width: 14px; height: 14px; stroke-width: 2; display: block; }\n  .sc-badge {\n    font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;\n    padding: 4px 8px; border-radius: 999px; line-height: 1; white-space: nowrap;\n  }\n  .sc-badge.ginger { background: var(--accent); color: #fff; }\n  .sc-badge.teal { background: var(--opp-info-bg); color: var(--opp-info); }\n  .sc-badge.soft { background: var(--opp-ginger-light); color: var(--accent-press); }\n  .sc-badge.green { background: var(--opp-success-bg); color: var(--opp-success); }\n  .sc-badge.warn { background: var(--opp-warn-bg); color: var(--opp-warn); }\n\n  /* (1) step flow */\n  .sc-steplist { display: flex; flex-direction: column; margin-top: 10px; }\n  .sc-step { position: relative; display: flex; align-items: center; gap: 12px; padding: 5px 0; font-size: 13px; color: var(--opp-ink-2); }\n  .sc-step::after { content: \"\"; position: absolute; left: 11px; top: 26px; bottom: -5px; width: 2px; background: var(--opp-line); z-index: 0; }\n  .sc-step:last-child::after { display: none; }\n  .sc-step .sc-sdot {\n    position: relative; z-index: 1; width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;\n    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;\n    background: #fff; border: 1.5px solid var(--opp-line-2); color: var(--opp-mute);\n  }\n  .sc-step.done .sc-sdot { background: var(--opp-success); border-color: var(--opp-success); color: #fff; }\n  .sc-step.active .sc-sdot { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px rgba(181,83,10,0.14); }\n  .sc-step.active { color: var(--opp-ink); font-weight: 600; }\n  .sc-step .sc-sdot svg { width: 13px; height: 13px; }\n\n  /* (2) strength ring */\n  .sc-ring { position: relative; width: 116px; height: 116px; }\n  .sc-ring svg { width: 100%; height: 100%; }\n  .sc-ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-weight: 600; font-size: 30px; color: var(--accent); }\n  .sc-ring-num span { font-size: 15px; margin-left: 1px; }\n  .sc-checks { display: flex; flex-direction: column; gap: 8px; }\n  .sc-check { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--opp-ink-2); }\n  .sc-check .ck { width: 18px; height: 18px; border-radius: 50%; background: var(--opp-success-bg); color: var(--opp-success); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }\n  .sc-check .ck svg { width: 11px; height: 11px; stroke-width: 2.6; }\n\n  /* (3,7) messaging */\n  .sc-msg-head { display: flex; align-items: center; gap: 11px; padding-bottom: 13px; border-bottom: 1px solid var(--opp-line); margin-bottom: 14px; }\n  .sc-av { width: 34px; height: 34px; border-radius: 50%; background: var(--opp-grad-ginger); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-weight: 600; font-size: 13px; flex-shrink: 0; }\n  .sc-online { font-size: 11px; color: var(--opp-success); display: inline-flex; align-items: center; gap: 5px; }\n  .sc-online::before { content: \"\"; width: 7px; height: 7px; border-radius: 50%; background: var(--opp-success); }\n  .sc-thread { display: flex; flex-direction: column; gap: 10px; }\n  .sc-bubble { max-width: 90%; padding: 10px 13px; border-radius: 13px; font-size: 12.5px; line-height: 1.5; }\n  .sc-bubble.sys { align-self: center; background: var(--opp-cream-2); color: var(--opp-mute); font-size: 11px; padding: 6px 12px; border-radius: 999px; max-width: 100%; }\n  .sc-bubble.admin { align-self: flex-start; background: var(--accent); color: #fff; border-top-left-radius: 4px; }\n  .sc-att { margin-top: 8px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 6px 9px; display: inline-flex; align-items: center; gap: 7px; font-size: 11px; }\n  .sc-att svg { width: 13px; height: 13px; }\n\n  /* (4) credential library grid */\n  .sc-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; flex: 1; }\n  .sc-doc { position: relative; border: 1px solid var(--opp-line); border-radius: 10px; background: #fff; padding: 13px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }\n  .sc-doc .di { width: 30px; height: 30px; border-radius: 8px; background: var(--opp-ginger-light); color: var(--accent); display: flex; align-items: center; justify-content: center; }\n  .sc-doc .di svg { width: 15px; height: 15px; }\n  .sc-doc .dn { font-size: 12.5px; font-weight: 600; color: var(--opp-ink); line-height: 1.25; }\n  .sc-doc .sc-badge { position: absolute; top: 10px; right: 10px; }\n  .sc-star { color: var(--opp-warn); display: inline-flex; }\n  .sc-star svg { width: 12px; height: 12px; }\n\n  /* (5) eligibility question */\n  .sc-prog { height: 5px; border-radius: 999px; background: var(--opp-line); overflow: hidden; }\n  .sc-prog span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }\n  .sc-q { font-family: var(--font-serif); font-weight: 600; font-size: 19px; line-height: 1.25; color: var(--opp-ink); margin: 14px 0 4px; }\n  .sc-opts { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }\n  .sc-opt { border: 1.5px solid var(--opp-line-2); border-radius: 999px; padding: 10px 16px; font-size: 13px; color: var(--opp-ink-2); background: #fff; display: flex; align-items: center; justify-content: space-between; }\n  .sc-opt.sel { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }\n  .sc-opt.sel svg { width: 15px; height: 15px; }\n\n  /* (6) listing card */\n  .sc-listing { position: relative; border: 1px solid var(--opp-line); border-radius: 14px; background: #fff; padding: 18px; flex: 1; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow-sm); }\n  .sc-listing .sc-badge.teal { position: absolute; top: 16px; right: 16px; }\n  .sc-orglogo { width: 48px; height: 48px; border-radius: 11px; background: var(--opp-cream-2); border: 1px solid var(--opp-line); display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-weight: 600; font-size: 18px; color: var(--accent-press); }\n  .sc-meta-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: auto; }\n\n  /* (7) thread list */\n  .sc-tlist { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }\n  .sc-titem { display: flex; align-items: center; gap: 12px; border: 1px solid var(--opp-line); border-radius: 12px; background: #fff; padding: 11px 13px; }\n  .sc-titem .body { flex: 1; min-width: 0; }\n  .sc-titem .nm { font-size: 13px; font-weight: 600; color: var(--opp-ink); display: flex; align-items: center; gap: 7px; }\n  .sc-titem .pv { font-size: 11.5px; color: var(--opp-mute); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n  .sc-unread { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }\n\n  /* (8) tracker timeline */\n  .sc-tl { display: flex; flex-direction: column; margin-top: 12px; }\n  .sc-tlrow { position: relative; display: flex; gap: 14px; padding-bottom: 14px; }\n  .sc-tlrow:last-child { padding-bottom: 0; }\n  .sc-tlrow::after { content: \"\"; position: absolute; left: 8px; top: 18px; bottom: -2px; width: 2px; background: var(--opp-line); }\n  .sc-tlrow:last-child::after { display: none; }\n  .sc-tlrow .tldot { position: relative; z-index: 1; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--opp-line-2); flex-shrink: 0; margin-top: 1px; }\n  .sc-tlrow.done .tldot { background: var(--accent); border-color: var(--accent); }\n  .sc-tlrow.active .tldot { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 0 rgba(181,83,10,0.5); animation: sc-pulse 1.8s var(--ease-in-out) infinite; }\n  @keyframes sc-pulse x; font-size: 13px; color: var(--opp-mute); margin-top: 4px; }\n  .sc-search svg { width: 15px; height: 15px; }\n  .sc-chips { display: flex; gap: 7px; margin-top: 12px; flex-wrap: wrap; }\n  .sc-chip { font-size: 11.5px; font-weight: 500; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--opp-line-2); background: #fff; color: var(--opp-ink-2); }\n  .sc-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }\n\n  /* (12) notifications */\n  .sc-notes { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }\n  .sc-note { display: flex; align-items: center; gap: 12px; border: 1px solid var(--opp-line); border-radius: 12px; background: #fff; padding: 12px 14px; }\n  .sc-note.hl { border-left: 3px solid var(--accent); background: linear-gradient(90deg, var(--opp-ginger-light), #fff 40%); }\n  .sc-note .ni { width: 34px; height: 34px; border-radius: 9px; background: var(--opp-ginger-light); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }\n  .sc-note .ni svg { width: 16px; height: 16px; }\n  .sc-note .ni.teal { background: var(--opp-info-bg); color: var(--opp-info); }\n  .sc-note .ni.green { background: var(--opp-success-bg); color: var(--opp-success); }\n  .sc-note .nbody { flex: 1; min-width: 0; }\n  .sc-note .nt { font-size: 13px; font-weight: 600; color: var(--opp-ink); line-height: 1.3; }\n  .sc-note .ntime { font-size: 11px; color: var(--opp-mute); margin-top: 2px; }\n\n  /* (13) payment */\n  .sc-pay { display: flex; flex-direction: column; gap: 0; margin-top: 6px; }\n  .sc-payrow { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px dashed var(--opp-line); font-size: 13.5px; color: var(--opp-ink-2); }\n  .sc-payrow .v { font-weight: 600; color: var(--opp-ink); font-variant-numeric: tabular-nums; }\n  .sc-paytotal { display: flex; align-items: baseline; justify-content: space-between; padding-top: 14px; }\n
