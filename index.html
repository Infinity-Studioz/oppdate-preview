  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 avatars */\n  --secondary:     #C4843A;\n  --amber:         #D4843A;\n\n  --ink:           #2A1206;   /* headings */\n  --text-primary:  #1C1C1C;   /* nav, buttons, FAQ questions */\n  --ink-2:         #5A4434;\n  --muted:         #8C6A55;\n  --border:        #D8CCC4;\n  --border-faq:    #E7E5E4;\n  --border-strong: #C9B7A8;\n\n  --slate:         #334155;   /* nav dropdown, testimonials, footer surface */\n  --ivory:         #F5E6D8;   /* warm cream for light-surface chips only */\n  --ivory-mute:    rgba(255, 255, 255, 0.60);\n  --ivory-faint:   rgba(255, 255, 255, 0.45);\n\n  /* semantic helpers for ported mockup components */\n  --warn:          #C4881C;\n  --warn-bg:       #FBF1DA;\n\n  /* ---- Hero illustration tokens (locked — match approved page) ---- */\n  --opp-grad-ginger: linear-gradient(135deg, #B5520F 0%, #7A2D05 55%, #6E2F04 100%);\n  --opp-cream-2:   #F3E8D9;\n  --opp-line-2:    #D6C5AC;\n\n  /* ---- Radius ---- */\n  --r-sm: 8px;  --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-pill: 999px;\n\n  /* ---- Spacing ---- */\n  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;\n  --sp-7: 32px; --sp-8: 40px; --sp-9: 56px; --sp-10: 72px; --sp-11: 96px;\n\n  /* ---- Shadows (warm-tinted) ---- */\n  --shadow-xs:   0 1px 2px rgba(122, 45, 5, 0.05);\n  --shadow-card: 0 2px 12px rgba(122, 45, 5, 0.08);\n  --shadow-md:   0 8px 32px rgba(122, 45, 5, 0.12);\n  --shadow-lg:   0 12px 28px rgba(122, 45, 5, 0.10), 0 24px 60px rgba(122, 45, 5, 0.08);\n  --shadow-drop: 0 16px 48px rgba(0, 0, 0, 0.24);\n\n  /* ---- Type ---- */\n  --font-serif: 'Fraunces', Georgia, 'Times New Roman', serif;\n  --font-sans:  'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;\n  --font-mono:  ui-monospace, 'SF Mono', Menlo, Consolas, monospace;\n\n  /* ---- Motion ---- */\n  --ease-out-soft: cubic-bezier(0.22, 1, 0.36, 1);\n  --ease-in-out:   cubic-bezier(0.65, 0, 0.35, 1);\n  --dur-fast: 140ms; --dur-base: 220ms; --dur-slow: 420ms;\n}\n\n/* ============================================================\n   Base\n   ============================================================ */\n*, *::before, *::after { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; }\nbody {\n  background: var(--bg);\n  color: var(--text-primary);\n  font-family: var(--font-sans);\n  font-size: 16px;\n  line-height: 1.55;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\nimg { max-width: 100%; display: block; }\na { color: inherit; text-decoration: none; }\nbutton { font: inherit; }\n\n.wrap {\n  width: 100%;\n  max-width: 1200px;\n  margin-inline: auto;\n  padding-inline: var(--sp-6);\n}\nsection { position: relative; }\n\n/* ---- Type helpers ---- */\n.eyebrow {\n  font-family: var(--font-sans); font-weight: 600;\n  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;\n  color: var(--secondary);\n  display: inline-block;\n}\n.h-display {\n  font-family: var(--font-serif); font-weight: 700;\n  font-size: 60px; line-height: 1.04; letter-spacing: -0.02em;\n  font-optical-sizing: auto; margin: 0; text-wrap: balance; color: var(--ink);\n}\n.h2 {\n  font-family: var(--font-serif); font-weight: 600;\n  font-size: 44px; line-height: 1.1; letter-spacing: -0.018em;\n  font-optical-sizing: auto; margin: 0; text-wrap: balance; color: var(--ink);\n}\n.h3 {\n  font-family: var(--font-serif); font-weight: 600;\n  font-size: 22px; line-height: 1.2; letter-spacing: -0.01em;\n  margin: 0; color: var(--ink);\n}\n.lede { font-size: 18px; line-height: 1.65; color: var(--muted); margin: 0; text-wrap: pretty; }\n\n/* ---- Buttons ---- */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 9px;\n  border-radius: var(--r-pill);\n  font-family: var(--font-sans); font-weight: 600; font-size: 16px;\n  border: 1px solid transparent; cursor: pointer; white-space: nowrap;\n  transition: background var(--dur-base) var(--ease-out-soft),\n              transform var(--dur-base) var(--ease-out-soft),\n              box-shadow var(--dur-base) var(--ease-out-soft),\n              border-color var(--dur-base) var(--ease-out-soft),\n              color var(--dur-base) var(--ease-out-soft);\n}\n.btn .lucide { width: 18px; height: 18px; }\n.btn-primary {\n  background: var(--primary); color: #fff;\n  box-shadow: 0 6px 16px rgba(122, 45, 5, 0.16);\n}\n.btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 10px 24px rgba(122, 45, 5, 0.22); }\n.btn-primary:active { background: var(--primary-press); transform: translateY(0); }\n.btn-primary .lucide { transition: transform var(--dur-fast) var(--ease-out-soft); }\n.btn-primary:hover .lucide { transform: translateX(3px); }\n.btn-secondary {\n  background: transparent; color: var(--text-primary); border: 1.5px solid var(--text-primary);\n  font-weight: 500;\n}\n.btn-secondary:hover { background: var(--text-primary); color: var(--bg); }\n\n.btn-lg { height: 52px; padding: 0 28px; }\n.btn-xl { height: 56px; padding: 0 32px; }\n\n/* text link with arrow */\n.link-arrow {\n  color: var(--primary); font-weight: 600; font-size: 15px;\n  display: inline-flex; align-items: center; gap: 7px;\n}\n.link-arrow .lucide { width: 16px; height: 16px; transition: transform var(--dur-fast) var(--ease-out-soft); }\n.link-arrow:hover .lucide { transform: translateX(3px); }\n.link-arrow:hover { text-decoration: underline; text-underline-offset: 3px; }\n\n/* ============================================================\n   1. Announcement bar\n   ============================================================ */\n.announce {\n  background: var(--announce-bg); color: #fff;\n  text-align: center; font-size: 14px; font-weight: 500;\n  height: 40px; display: flex; align-items: center; justify-content: center;\n  gap: 6px; letter-spacing: 0.01em;\n}\n.announce a {\n  color: #fff; text-decoration: underline; text-underline-offset: 2px;\n  font-weight: 600; display: inline-flex; align-items: center; gap: 4px;\n}\n\n/* ============================================================\n   2. Navigation\n   ============================================================ */\n.nav {\n  position: sticky; top: 16px; z-index: 60;\n  background: transparent;\n  pointer-events: none;\n  padding: 0 var(--sp-6);\n}\n.nav.scrolled {\n  background: transparent;\n  border-bottom: none;\n}\n.nav.scrolled .nav-inner {\n  background: rgba(250, 247, 244, 0.96);\n  box-shadow: rgba(0, 0, 0, 0.18) 0 12px 36px 0, inset 0 1px 0 rgba(255, 255, 255, 0.80);\n}\n.nav-inner {\n  height: 64px;\n  max-width: 1160px; margin-inline: auto; padding-inline: 32px;\n  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-7);\n  background: rgba(255, 255, 255, 0.80);\n  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);\n  border-radius: var(--r-pill);\n  border: 1.5px solid rgba(255, 255, 255, 0.70);\n  box-shadow: rgba(0, 0, 0, 0.10) 0 8px 24px 0, rgba(0, 0, 0, 0.04) 0 2px 6px 0, inset 0 1px 0 rgba(255, 255, 255, 0.85);\n  pointer-events: auto;\n  transition: background var(--dur-base) var(--ease-out-soft), box-shadow var(--dur-base) var(--ease-out-soft);\n}\n.nav-logo {\n  display: inline-flex; align-items: center; gap: 9px;\n  font-family: var(--font-serif); font-weight: 600; font-size: 22px;\n  letter-spacing: -0.01em; flex-shrink: 0;\n}\n.nav-logo .mark { width: 40px; height: 40px; object-fit: contain; }\n.nav-logo .opp { color: var(--text-primary); }\n.nav-logo .date { color: var(--accent-deep); }\n\n.nav-links {\n  display: flex; align-items: center; gap: var(--sp-7);\n  list-style: none; margin: 0; padding: 0; flex: 1; justify-content: center;\n}\n.nav-links > li { position: relative; }\n.nav-trigger {\n  font-family: var(--font-sans); font-size: 15px; font-weight: 500; color: var(--text-primary);\n  background: transparent; border: 0; cursor: pointer;\n  display: inline-flex; align-items: center; gap: 5px; padding: 8px 0;\n  transition: color var(--dur-fast) var(--ease-out-soft);\n}\n.nav-trigger:hover, .nav-mega-host.open .nav-trigger { color: var(--primary); }\n.nav-trigger .chev {\n  width: 14px; height: 14px; transition: transform var(--dur-base) var(--ease-out-soft);\n}\n.nav-mega-host.open .nav-trigger .chev { transform: rotate(180deg); }\n\n.nav-actions { display: flex; align-items: center; gap: var(--sp-4); }\n.nav-login {\n  font-size: 15px; font-weight: 500; color: var(--ink);\n  transition: color var(--dur-fast) var(--ease-out-soft);\n}\n.nav-login:hover { color: var(--primary); }\n.nav-cta { height: 40px; padding: 0 20px; font-size: 15px; }\n\n/* ---- Mega-menu (slate dropdown) ---- */\n.nav-mega {\n  position: absolute; top: calc(100% + 14px); left: 50%; transform: translate(-50%, -6px);\n  background: var(--slate); color: #fff;\n  border-radius: var(--r-lg);\n  box-shadow: var(--shadow-drop);\n  padding: 28px;\n  width: 640px;\n  display: grid; grid-template-columns: 280px 1fr; gap: 28px;\n  opacity: 0; visibility: hidden; pointer-events: none;\n  transition: opacity var(--dur-base) var(--ease-out-soft),\n              transform var(--dur-base) var(--ease-out-soft),\n              visibility 0s linear var(--dur-base);\n  z-index: 70;\n}\n.nav-mega::before { content: \"\"; position: absolute; top: -16px; left: 0; right: 0; height: 16px; }\n.nav-mega-host.open .nav-mega {\n  opacity: 1; visibility: visible; pointer-events: auto; transform: translate(-50%, 0);\n  transition: opacity var(--dur-base) var(--ease-out-soft),\n              transform var(--dur-base) var(--ease-out-soft),\n              visibility 0s linear 0s;\n}\n.nav-mega.compact {\n  width: 280px; grid-template-columns: 1fr; left: auto; right: 0; transform: translate(0, -6px);\n}\n.nav-mega-host.open .nav-mega.compact { transform: translate(0, 0); }\n\n.mega-label {\n  font-family: var(--font-sans); font-weight: 600;\n  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; -visual svg.bg-map { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.42; pointer-events: none; }\n.hero-visual svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }\n.hero-visual::before {\n  content: \"\"; position: absolute; inset: -8%;\n  background: radial-gradient(circle at 50% 50%, rgba(245, 230, 216, 0.7) 0%, rgba(245, 230, 216, 0.2) 35%, rgba(250, 247, 244, 0) 65%);\n  pointer-events: none;\n}\n.hub {\n  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);\n  width: 144px; height: 144px; border-radius: 50%; background: #2C1A0E;\n  display: flex; align-items: center; justify-content: center;\n  box-shadow: 0 0 0 8px rgba(181, 83, 10, 0.22), 0 0 0 20px rgba(181, 83, 10, 0.14),\n    0 0 0 40px rgba(181, 83, 10, 0.07), 0 0 0 64px rgba(181, 83, 10, 0.03),\n    0 22px 48px rgba(44, 26, 14, 0.40), 0 0 60px rgba(181, 83, 10, 0.25);\n  z-index: 3; animation: hub-pulse 3.6s var(--ease-in-out) infinite;\n}\n@keyframes hub-pulse {\n  0%, 100% { box-shadow: 0 0 0 8px rgba(181, 83, 10, 0.22), 0 0 0 20px rgba(181, 83, 10, 0.14), 0 0 0 40px rgba(181, 83, 10, 0.07), 0 0 0 64px rgba(181, 83, 10, 0.03), 0 22px 48px rgba(44, 26, 14, 0.40), 0 0 60px rgba(181, 83, 10, 0.25); }\n  50%      { box-shadow: 0 0 0 12px rgba(181, 83, 10, 0.26), 0 0 0 28px rgba(181, 83, 10, 0.14), 0 0 0 54px rgba(181, 83, 10, 0.06), 0 0 0 82px rgba(181, 83, 10, 0.02), 0 26px 56px rgba(44, 26, 14, 0.44), 0 0 90px rgba(181, 83, 10, 0.35); }\n}\n.hub img { width: 78%; height: auto; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15)); }\n.node {\n  position: absolute; transform: translate(-50%, -50%);\n  background: linear-gradient(180deg, #FFFCF8 0%, var(--opp-cream-2) 100%);\n  border: 1px solid rgba(181, 83, 10, 0.32); border-radius: var(--r-pill);\n  padding: 11px 18px 11px 13px;\n  font-family: var(--font-sans); font-size: 14px; font-weight: 600; color: var(--ink);\n  box-shadow: 0 8px 18px rgba(142, 63, 5, 0.14), 0 2px 4px rgb x; font-size: 15px; color: var(--muted); }\n.stat .num-placeholder {\n  height: 56px; border: 2px dashed var(--border); border-radius: var(--r-sm);\n  display: flex; align-items: center; justify-content: center;\n  background: var(--bg); max-width: 200px; margin-inline: auto;\n}\n.stat .lbl-placeholder { font-style: italic; font-size: 13px; }\n\n/* ============================================================\n   5. Features (2×2)\n   ============================================================ */\n.section-head { text-align: center; max-width: 600px; margin-inline: auto; }\n.section-head .eyebrow { margin-bottom: 14px; }\n.section-head h2 { margin-bottom: 16px; }\n.section-head p { margin-inline: auto; max-width: 560px; font-size: 17px; }\n\n.features { background: var(--bg); padding: var(--sp-11) 0; }\n.features .section-head { margin-bottom: 56px; }\n.feat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp-6); }\n.feat-card {\n  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);\n  padding: 32px; display: flex; flex-direction: column; gap: 14px;\n  transition: box-shadow var(--dur-base) var(--ease-out-soft), transform var(--dur-base) var(--ease-out-soft);\n}\n.feat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }\n.feat-ic {\n  width: 52px; height: 52px; border-radius: var(--r-md);\n  background: rgba(212, 132, 58, 0.12); color: var(--amber);\n  display: inline-flex; align-items: center; justify-content: center;\n}\n.feat-ic .lucide { width: 28px; height: 28px; stroke-width: 1.75; }\n.feat-card h3 { margin: 4px 0 0; }\n.feat-card p { color: var(--muted); font-size: 16px; line-height: 1.6; margin: 0; flex: 1; }\n.tag-premium {\n  align-self: flex-start; margin-top: 4px;\n  font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: var(--r-pill);\n  background: rgba(212, 132, 58, 0.10); color: var(--amber);\n}\n\n/* ======================================================= ar(--border); border-radius: var(--r-md); box-shadow: var(--shadow-md);\n  padding: 10px 14px; font-size: 12px; display: inline-flex; align-items: center; gap: 8px;\n  color: var(--ink); font-weight: 500;\n}\n.mockup-tag .swatch {\n  width: 22px; height: 22px; border-radius: 6px; background: var(--opp-grad-ginger);\n  display: inline-flex; align-items: center; justify-content: center; color: #fff;\n}\n.mockup-tag .swatch .lucide { width: 13px; height: 13px; }\n\n/* listings */\n.disc-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }\n.disc-search {\n  display: flex; align-items: center; gap: 10px; flex: 1;\n  background: var(--band); border: 1px solid var(--border); border-radius: var(--r-md);\n  padding: 11px 14px; font-size: 14px; color: var(--muted);\n}\n.disc-search .lucide { width: 16px; height: 16px; }\n.live-badge {\n  font-size: 11px; font-weight: 600; padding: 6px 11px; border-radius: var(--r-pill);\n  background: rgba(212, 132, 58, 0.14); color: var(--primary); white-space: nowrap;\n}\n.disc-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }\n.chip {\n  font-size: 12.5px; font-weight: 500; padding: 5px 12px; border-radius: var(--r-pill);\n  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);\n}\n.chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }\n.disc-cards { display: flex; flex-direction: column; gap: 12px; }\n.opp-card {\n  border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px 16px;\n  background: var(--surface); display: grid; grid-template-columns: 38px 1fr auto; gap: 14px; align-items: center;\n}\n.opp-card .orgmark {\n  width: 38px; height: 38px; border-radius: 8px; background: var(--ivory); color: var(--primary-press);\n  display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-weight: 600; font-size: 15px;\n}\n.opp-card .org { font-size: 10.5px; font-weight: 600; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }\n.opp-card .ttl { font-family: var(--font-serif); font-weight: 600; font-size: 16px; color: var(--ink); margin-top: 2px; line-height: 1.25; }\n.badge { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: var(--r-pill); white-space: nowrap; }\n.badge.muted { background: var(--band); color: var(--muted); }\n.badge.warn { background: var(--warn-bg); color: var(--warn); }\n.badge.ginger { background: rgba(212, 132, 58, 0.16); color: var(--primary-press); }\n\n/* credential library */\n.lib-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }\n.lib-head h5 { font-family: var(--font-sans); font-weight: 600; font-size: 16px; margin: 0; color: var(--ink); }\n.lib-head .count { color: var(--muted); font-size: 13px; }\n.lib-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }\n.doc-tile {\n  border: 1px solid var(--border); border-radius: var(--r-md); padding: 16px 14px;\n  background: var(--surface); position: relative; aspect-ratio: 1 / 1.05;\n  display: flex; flex-direction: column; justify-content: space-between;\n}\n.doc-tile .ic {\n  width: 34px; height: 34px; border-radius: 9px; background: var(--ivory); color: var(--primary);\n  display: inline-flex; align-items: center; justify-content: center;\n}\n.doc-tile .ic .lucide { width: 17px; height: 17px; }\n.doc-tile .nm { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.3; }\n.doc-tile .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }\n.doc-tile .reuse {\n  position: absolute; top: 10px; right: 10px; font-size: 10px; font-weight: 700; padding: 4px 9px;\n  border-radius: var(--r-pill); background: var(--amber); color: #2A1206;\n  letter-spacing: 0.06em; text-transform: uppercase; line-height: 1;\n}\n.doc-tile.empty { border-style: dashed; color: var(--muted); align-items: center; justify-content: center;      <a class=\"t-link\" href=\"#\">Read their story →<\u002Fa>\n          <\u002Farticle>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"t-foot\">\n        <div class=\"t-dots\" id=\"tDots\"><span class=\"active\"><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n        <div class=\"t-nav\">\n          <button type=\"button\" aria-label=\"Previous\" id=\"tPrev\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"15 18 9 12 15 6\"><\u002Fpolyline><\u002Fsvg><\u002Fbutton>\n          <button type=\"button\" aria-label=\"Next\" id=\"tNext\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 18 15 12 9 6\"><\u002Fpolyline><\u002Fsvg><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========== 9. Services ========== -->\n<section class=\"services\" id=\"services\" data-screen-label=\"07 Services\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <span class=\"eyebrow\">Services<\u002Fspan>\n      <h2 class=\"h2\">More than opportunities.<\u002Fh2>\n      <p class=\"lede\">Expert support and curated resources to strengthen every application you submit.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"svc-grid\">\n      <article class=\"svc\">\n        <span class=\"svc-ic\"><i data-lucide=\"video\"><\u002Fi><\u002Fspan>\n        <h3 class=\"h3\">Consultations<\u002Fh3>\n        <p>Book a one-on-one session with an admissions or career expert. Bring your questions. Leave with a plan.<\u002Fp>\n        <a class=\"link-arrow\" href=\"#\">Learn more <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa>\n      <\u002Farticle>\n      <article class=\"svc\">\n        <span class=\"svc-ic\"><i data-lucide=\"users\"><\u002Fi><\u002Fspan>\n        <h3 class=\"h3\">Mentorship<\u002Fh3>\n        <p>Structured guidance over weeks or months. Pair with a mentor in your field for ongoing support on your applications and career goals.<\u002Fp>\n        <a class=\"link-arrow\" href=\"#\">Learn more <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa>\n      <\u002Farticle>\n      <article class=\"svc\">\n        <span class=\"svc-ic\"><i data-lucide=\"book-open\"><\u002Fi><\u002Fspan>\n        <h3 class=\"h3\">eBooks<\u002Fh3>\n        <p>Curated resources to strengthen your applications, written by people who have reviewed thousands of them.<\u002Fp>\n        <a class=\"link-arrow\" href=\"#\">Learn more <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========== 10. FAQ ========== -->\n<section class=\"faq\" data-screen-label=\"08 FAQ\">\n  <div class=\"wrap\">\n    <div class=\"faq-grid\">\n      <div class=\"faq-left\">\n        <h2 class=\"h2\">Got questions? We have got answers.<\u002Fh2>\n        <p class=\"lede\">Everything you need to know before getting started.<\u002Fp>\n        <hr class=\"faq-divider\">\n        <div class=\"faq-help\">\n          <div class=\"t\">Still have questions?<\u002Fdiv>\n          <div class=\"s\">Contact us and we will help you out.<\u002Fdiv>\n          <a class=\"btn-contact\" href=\"#\">Contact support <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <ul class=\"faq-list\" id=\"faqList\">\n        <li class=\"faq-item open\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"true\"><span>What is OppDate?<\u002Fspan><span class=\"ic\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\"><p>OppDate is an opportunity discovery platform that gives you access to thousands of verified opportunities including scholarships, internships, fellowships, jobs, and training programmes from around the world. Your subscription unlocks the full listings feed, AI tools, and personalized matching.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n        <li class=\"faq-item\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"false\"><span>What is OppDate Guide?<\u002Fspan><span class=\"ic\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\"><p>OppDate Guide is your AI companion inside the platform. The moment you log in it greets you by name and stays with you across every screen. It knows which opportunity you are viewing, answers your questions, and walks you through every step of the application process.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n        <li class=\"faq-item\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"false\"><span>How does Premium access work?<\u002Fspan><span class=\"ic\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\"><p>Premium is a single subscription at $12 per month. It unlocks the full listings feed, OppDate Guide, AI eligibility screening, personalized matching, and your application tracker. Without Premium, you can browse the platform and access Services (consultations, mentorship, eBooks) with a free account.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n        <li class=\"faq-item\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"false\"><span>How does the AI eligibility screening work?<\u002Fspan><span class=\"ic\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\"><p>When you view an opportunity, OppDate Guide can run a quick eligibility check based on that opportunity's own criteria. You answer a few targeted questions and receive a clear result: eligible or not eligible, with the specific criteria that applied. If you are not eligible, OppDate suggests alternative opportunities matched to your profile.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n        <li class=\"faq-item\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"false\"><span>What types of opportunities are on OppDate?<\u002Fspan><span class=\"ic\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\"><p>Scholarships, internships, fellowships, entry-level jobs, training programmes, research grants, admissions opportunities, and more. All listings are verified before publication and updated daily.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n        <li class=\"faq-item\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"false\"><span>Can I reuse my documents for multiple applications?<\u002Fspan><span class=\"ic\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\"><p>Yes. Every document you upload goes into your credential library. Future applications pre-fill automatically from your library so you never upload the same file twice.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n        <li class=\"faq-item\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"false\"><span>How do I track my applications after submitting?<\u002Fspan><span class=\"ic\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\"><p>Your dashboard shows every application and its current status in real time. You receive an in-app notification and an email at every stage update.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n        <li class=\"faq-item\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"false\"><span>Is my personal information and documents secure?<\u002Fspan><span class=\"ic\" aria-hidden=\"true\"><\u002Fspan><\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\"><p>Yes. All documents are encrypted in transit and at rest. OppDate does not share your personal information or documents with third parties outside the application process.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========== 11. Final CTA ========== -->\n<section class=\"final\" id=\"start\" data-screen-label=\"09 Final CTA\">\n  <div class=\"wrap\">\n    <h2 class=\"h-display\">Your next big opportunity is one click away.<\u002Fh2>\n    <p class=\"lede\">Join thousands of students and professionals who use OppDate to discover and apply for the opportunities that matter.<\u002Fp>\n    <div class=\"ctas\">\n      <a class=\"btn btn-primary btn-xl\" href=\"#\">Get started <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa>\n      <a class=\"btn btn-secondary btn-xl\" href=\"#opportunities\">Browse opportunities<\u002Fa>\n    <\u002Fdiv>\n    <p class=\"fine\">No account needed to browse. Premium from $12 per month.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========== 12. Footer ========== -->\n<footer class=\"footer\" data-screen-label=\"10 Footer\">\n  <div class=\"wrap\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <a class=\"footer-lockup\" href=\"#\"><img class=\"mark\" src=\"f0d3fe78-5d31-4639-9d01-97c0056801c9\" alt=\"\"><span><span>Opp<\u002Fspan><span class=\"date\">Date<\u002Fspan><\u002Fspan><\u002Fa>\n        <span class=\"tagline\">Opportunities, up to date.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"footer-cta-col\">\n        <a class=\"btn btn-primary nav-cta\" href=\"#start\">Get started<\u002Fa>\n        <div class=\"support\"><a href=\"mailto:support@oppdate.com\">support@oppdate.com<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <hr class=\"footer-divider\">\n\n    <div class=\"footer-links\">\n      <div class=\"footer-col\">\n        <h6>Platform<\u002Fh6>\n        <ul>\n          <li><a href=\"#opportunities\">Opportunities<\u002Fa><\u002Fli>\n          <li><a href=\"#features\">OppDate Guide<\u002Fa><\u002Fli>\n          <li><a href      { cx: 22, cy: 46, rx: 4,  ry: 3,  density: 0.9 },\n      { cx: 28, cy: 64, rx: 7,  ry: 14, density: 1.0 },\n      { cx: 51, cy: 28, rx: 7,  ry: 6,  density: 1.1 },\n      { cx: 53, cy: 44, rx: 9,  ry: 6,  density: 0.95 },\n      { cx: 56, cy: 58, rx: 8,  ry: 11, density: 1.0 },\n      { cx: 62, cy: 38, rx: 5,  ry: 4,  density: 0.9 },\n      { cx: 72, cy: 44, rx: 5,  ry: 6,  density: 1.0 },\n      { cx: 80, cy: 36, rx: 9,  ry: 7,  density: 1.05 },\n      { cx: 81, cy: 52, rx: 6,  ry: 4,  density: 0.95 },\n      { cx: 86, cy: 72, rx: 7,  ry: 5,  density: 1.0 },\n      { cx: 94, cy: 78, rx: 2,  ry: 2,  density: 0.9 }\n    ];\n    const step = 1.6;\n    const dots = [];\n    for (let y = 8; y <= 92; y += step) {\n      for (let x = 4; x <= 96; x += step) {\n        for (const b of blobs) {\n          const nx = (x - b.cx) / b.rx, ny = (y - b.cy) / b.ry;\n          if (nx*nx + ny*ny < 1) {\n            if (Math.random() > 0.18 * b.density) continue;\n            dots.push({ x: x + (Math.random()-0.5)*0.6, y: y + (Math.random()-0.5)*0.6, r: 0.32 + Math.random()*0.18 });\n            break;\n          }\n        }\n      }\n    }\n    const ns = 'http://www.w3.org/2000/svg';\n    const frag = document.createDocumentFragment();\n    for (const d of dots) {\n      const c = document.createElementNS(ns, 'circle');\n      c.setAttribute('cx', d.x); c.setAttribute('cy', d.y); c.setAttribute('r', d.r);\n      c.setAttribute('fill', '#C9B89D');\n      frag.appendChild(c);\n    }\n    svg.appendChild(frag);\n  })();\n\n  /* ---- Locked: hub connecting lines ---- */\n  (function buildLines() {\n    const visual = document.getElementById('heroVisual');\n    if (!visual) return;\n    const svg = visual.querySelector('.lines');\n    const nodes = visual.querySelectorAll('.node');\n    const ns = 'http://www.w3.org/2000/svg';\n    const hub = { x: 50, y: 50 };\n    nodes.forEach(node => {\n      const left = parseFloat(node.style.left), top = parseFloat(node.style.top);\n      const dx = hub.x - left, dy = hub.y - top;\n      const midX = (left + hub.x) / 2 + dy * 0.10, midY = (top + hub.y) / 2 - dx * 0.10;\n      const d = `M ${left} ${top} Q ${midX} ${midY} ${hub.x} ${hub.y}`;\n      const base = document.createElementNS(ns, 'path');\n      base.setAttribute('d', d); base.setAttribute('stroke', '#C4A882');\n      base.setAttribute('stroke-width', '0.85'); base.setAttribute('fill', 'none'); base.setAttribute('opacity', '0.6');\n      svg.appendChild(base);\n      const flow = document.createElementNS(ns, 'path');\n      flow.setAttribute('d', d); flow.setAttribute('stroke', '#A78A66');\n      flow.setAttribute('stroke-width', '1.1'); flow.setAttribute('fill', 'none'); flow.setAttribute('opacity', '0.85');\n      flow.setAttribute('class', 'flow');\n      flow.style.animationDelay = (Math.random() * -2.4) + 's';\n      svg.appendChild(flow);\n    });\n  })();\n\n  /* ---- Nav background on scroll ---- */\n  (function nav() {\n    const nav = document.getElementById('nav');\n    const onScroll = () => { nav.classList.toggle('scrolled', window.scrollY > 8); };\n    window.addEventListener('scroll', onScroll, { passive: true });\n    onScroll();\n  })();\n\n  /* ---- Mega-menu open/close ---- */\n  (function megaMenu() {\n    const hosts = document.querySelectorAll('.nav-mega-host');\n    const OPEN = 80, CLOSE = 180;\n    let openTimer, closeTimer, current = null;\n    function open(host) {\n      clearTimeout(closeTimer); clearTimeout(openTimer);\n      if (current && current !== host) close(current, true);\n      host.classList.add('open');\n      host.querySelector('.nav-trigger').setAttribute('aria-expanded', 'true');\n      current = host;\n    }\n    function close(host, immediate) {\n      const doClose = () => {\n        host.classList.remove('open');\n        host.querySelector('.nav-trigger').setAttribute('aria-expanded', 'false');\n        if (current === host) current = null;\n      };\n      if (immediate) doClose();\n      else { clearTimeout(closeTimer); closeTimer = setTimeout(doClose, CLOSE); }\n    }\n    hosts.forEach(host => {\n      const trigger = host.querySelector('.nav-trigger');\n      host.addEventListener('mouseenter', () => { clearTimeout(closeTimer); clearTimeout(openTimer); openTimer = setTimeout(() => open(host), OPEN); });\n      host.addEventListener('mouseleave', () => { clearTimeout(openTimer); close(host); });\n      trigger.addEventListener('click', (e) => { e.preventDefault(); host.classList.contains('open') ? close(host, true) : open(host); });\n      trigger.addEventListener('keydown', (e) => { if (e.key === 'Escape') { close(host, true); trigger.focus(); } });\n    });\n    document.addEventListener('click', (e) => { if (!e.target.closest('.nav-mega-host')) hosts.forEach(h => close(h, true)); });\n    window.addEventListener('scroll', () => hosts.forEach(h => close(h, true)), { passive: true });\n  })();\n\n  /* ---- Mobile sheet ---- */\n  (function mobileMenu() {\n    const burger = document.getElementById('navBurger');\n    const menu = document.getElementById('mMenu');\n    if (!burger || !menu) return;\n    function setOpen(open) {\n      menu.classList.toggle('open', open);\n      menu.setAttribute('aria-hidden', open ? 'false' : 'true');\n      burger.setAttribute('aria-expanded', open ? 'true' : 'false');\n    }\n    burger.addEventListener('click', () => setOpen(!menu.classList.contains('open')));\n    menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => setOpen(false)));\n    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });\n  })();\n\n  /* ---- FAQ accordion ---- */\n  (function faqAccordion() {\n    const list = document.getElementById('faqList');\n    if (!list) return;\n    list.addEventListener('click', (e) => {\n      const btn = e.target.closest('.faq-q');\n      if (!btn) return;\n      const item = btn.closest('.faq-item');\n      const isOpen = item.classList.contains('open');\n      list.querySelectorAll('.faq-item').forEach(li => {\n        li.classList.remove('open');\n        const q = li.querySelector('.faq-q');\n        if (q) q.setAttribute('aria-expanded', 'false');\n      });\n      if (!isOpen) { item.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); }\n    });\n  })();\n\n  /* ---- Scroll reveal ---- */\n  (function reveal() {\n    const mark = (el, variant, delay) => {\n      if (!el) return;\n      el.classList.add('reveal');\n      if (variant) el.classList.add(variant);\n      if (delay) el.style.setProperty('--rd', delay + 'ms');\n    };\n    const cap = (i) => Math.min(i, 6);\n    document.querySelectorAll('.section-head').forEach(el => mark(el, null, 0));\n    document.querySelectorAll('.stats-grid .stat').forEach((el, i) => mark(el, null, cap(i) * 110));\n    document.querySelectorAll('.feat-grid .feat-card').forEach((el, i) => mark(el, 'reveal-scale', cap(i) * 80));\n    document.querySelectorAll('.split-grid').forEach(g => {\n      const lib = g.classList.contains('library');\n      mark(g.querySelector('.split-text'), lib ? 'reveal-right' : 'reveal-left', 0);\n      mark(g.querySelector('.split-visual'), lib ? 'reveal-left' : 'reveal-right', 90);\n    });\n    document.querySelectorAll('.t-grid .t-card').forEach((el, i) => mark(el, null, cap(i) * 90));\n    document.querySelectorAll('.svc-grid .svc').forEach((el, i) => mark(el, 'reveal-scale', cap(i) * 80));\n    mark(document.querySelector('.faq-left'), 'reveal-left', 0);\n    document.querySelectorAll('.faq-list .faq-item').forEach((el, i) => mark(el, 'reveal-right', cap(i) * 55));\n    [document.querySelector('.final h2'), document.querySelector('.final .lede'), document.querySelector('.final .ctas'), document.querySelector('.final .fine')].forEach((el, i) => mark(el, 'reveal-scale', i * 90));\n    document.querySelectorAll('.footer-col').forEach((el, i) => mark(el, null, cap(i) * 60));\n\n    let items = [...document.querySelectorAll('.reveal')];\n    function check() {\n      const vh = window.innerHeight || document.documentElement.clientHeight;\n      for (let i = items.length - 1; i >= 0; i--) {\n        const r = items[i].getBoundingClientRect();\n        if (r.top < vh * 0.9 && r.bottom > 0) { items[i].classList.add('in'); items.splice(i, 1); }\n      }\n    }\n    let ticking = false;\n    window.addEventListener('scroll', () => { if (ticking) return; ticking = true; requestAnimationFrame(() => { ticking = false; check(); }); }, { passive: true });\n    window.addEventListener('resize', check);\n    requestAnimationFrame(() => requestAnimationFrame(check));\n    setTimeout(check, 300);\n\n    setTimeout(() => {\n      const h1 = document.querySelector('.hero-anim .hero-h1');\n      if (h1 && parseFloat(getComputedStyle(h1).opacity) < 0.05) document.querySelector('.hero-anim').classList.add('hero-anim-fallback');\n    }, 1500);\n  })();\n\n  /* ---- Testimonials carousel ---- */\n  (function testimonialCarousel() {\n    var wrap = document.querySelector('.t-track-wrap');\n    var track = document.getElementById('tTrack');\n    if (!track || !wrap) return;\n    var dotEls = [...document.querySelectorAll('#tDots span')];\n    var prevBtn = document.getElementById('tPrev');\n    var nextBtn = document.getElementById('tNext');\n    var total = track.querySelectorAll('.t-card').length;\n    var current = 0;\n\n    function perPage() { return window.innerWidth >= 960 ? 3 : 1; }\n    function pageCount() { return Math.ceil(total / perPage()); }\n    function cardW() {\n      var pp = perPage(), tw = wrap.getBoundingClientRect().width, gap = 24;\n      return (tw - gap * (pp - 1)) / pp;\n    }\n    function baseOffset(idx) {\n      return perPage() >= total ? 0 : idx * (cardW() + 24);\n    }\n    function update() {\n      track.style.transform = 'translateX(-' + baseOffset(current) + 'px)';\n      dotEls.forEach(function(d, i) { d.classList.toggle('active', i === current); });\n      if (prevBtn) prevBtn.disabled = current === 0;\n      if (nextBtn) nextBtn.disabled = current >= pageCount() - 1;\n    }\n\n    if (prevBtn) prevBtn.addEventListener('click', function() {\n      if (current > 0) { current--; update(); }\n    });\n    if (nextBtn) nextBtn.addEventListener('click', function() {\n      if (current < pageCount() - 1) { current++; update(); }\n    });\n\n    /* mouse drag */\n    var isDragging = false, dragX0 = 0;\n    wrap.addEventListener('mousedown', function(e) {\n      if (e.button !== 0) return;\n      isDragging = true; dragX0 = e.clientX;\n      wrap.classList.add('dragging'); track.classList.add('no-transition'); e.preventDefault();\n    });\n    document.addEventListener('mousemove', function(e) {\n      if (!isDragging) return;\n      track.style.transform = 'translateX(' + (-baseOffset(current) + (e.clientX - dragX0)) + 'px)';\n    });\n    document.addEventListener('mouseup', function(e) {\n      if (!isDragging) return;\n      isDragging = false; wrap.classList.remove('dragging'); track.classList.remove('no-transition');\n      var dx = e.clientX - dragX0;\n      if (dx < -60 && current < pageCount() - 1) current++;\n      else if (dx > 60 && current > 0) current--;\n      update();\n    });\n\n    /* touch swipe */\n    var tx0 = 0;\n    wrap.addEventListener('touchstart', function(e) {\n      tx0 = e.touches[0].clientX; track.classList.add('no-transition');\n    }, { passive: true });\n    wrap.addEventListener('touchmove', function(e) {\n      track.style.transform = 'translateX(' + (-baseOffset(current) + (e.touches[0].clientX - tx0)) + 'px)';\n    }, { passive: true });\n    wrap.addEventListener('touchend', function(e) {\n      track.classList.remove('no-transition');\n      var dx = tx0 - e.changedTouches[0].clientX;\n      if (Math.abs(dx) > 44) {\n        if (dx > 0 && current < pageCount() - 1) current++;\n        else if (dx < 0 && current > 0) current--;\n      }\n      update();\n    }, { passive: true });\n\n    var rt;\n    window.addEventListener('resize', function() {\n      clearTimeout(rt);\n      rt = setTimeout(function() { if (window.innerWidth >= 960) current = 0; update(); }, 80);\n    }, { passive: true });\n\n    update();\n  })();\n\n  if (window.lucide) window.lucide.createIcons();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
