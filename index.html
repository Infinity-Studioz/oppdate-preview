v>\n                <div class=\"nm\">Amara T.<\u002Fdiv>\n                <div class=\"org\">University of Lagos<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fheader>\n            <hr class=\"story-divider\">\n            <p class=\"story-metric\">Shortlisted for 2 of 3 applications.<\u002Fp>\n            <p class=\"story-quote\">I'd been applying for two years with no luck. OppDate submitted three applications in a week and I heard back on two of them.<\u002Fp>\n            <a class=\"story-link\" href=\"#\">Read their story →<\u002Fa>\n          <\u002Farticle>\n\n          <article class=\"story-card\">\n            <header class=\"story-who\">\n              <span class=\"av\">DO<\u002Fspan>\n              <div>\n                <div class=\"nm\">David O.<\u002Fdiv>\n                <div class=\"org\">Covenant University<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fheader>\n            <hr class=\"story-divider\">\n            <p class=\"story-metric\">Application submitted in under 24 hours.<\u002Fp>\n            <p class=\"story-quote\">The OppDate Apply process is unlike anything I've seen. They handled everything, I just checked my dashboard for updates.<\u002Fp>\n            <a class=\"story-link\" href=\"#\">Read their story →<\u002Fa>\n          <\u002Farticle>\n\n          <article class=\"story-card\">\n            <header class=\"story-who\">\n              <span class=\"av\">FK<\u002Fspan>\n              <div>\n                <div class=\"nm\">Fatima K.<\u002Fdiv>\n                <div class=\"org\">Ahmadu Bello University<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fheader>\n            <hr class=\"story-divider\">\n            <p class=\"story-metric\">Accepted to Chevening 2026.<\u002Fp>\n            <p class=\"story-quote\">I didn't think I was eligible. OppDate's eligibility check showed me I qualified, and their expert team handled my entire Chevening application.<\u002Fp>\n            <a class=\"story-link\" href=\"#\">Read their story →<\u002Fa>\n          <\u002Farticle>\n\n          <article class=\"story-card\">\n            <header class=\"story-who\">\n              <span class=\"av\">JM<\u002Fspan>\n              <div>\n                <div class=\"nm\">James M.<\u002Fdiv>\n                <div class=\"org\">University of Ghana<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fheader>\n            <hr class=\"story-divider\">\n            <p class=\"story-metric\">3 internship offers in one month.<\u002Fp>\n            <p class=\"story-quote\">I uploaded my documents once and OppDate applied to six internships on my behalf. Three came back with offers.<\u002Fp>\n            <a class=\"story-link\" href=\"#\">Read their story →<\u002Fa>\n          <\u002Farticle>\n\n          <article class=\"story-card\">\n            <header class=\"story-who\">\n              <span class=\"av\">NB<\u002Fspan>\n              <div>\n                <div class=\"nm\">Ngozi B.<\u002Fdiv>\n                <div class=\"org\">University of Ibadan<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fheader>\n            <hr class=\"story-divider\">\n            <p class=\"story-metric\">DAAD scholarship, fully funded.<\u002Fp>\n            <p class=\"story-quote\">OppDate found the DAAD scholarship and handled everything. I'm now studying in Germany on a full scholarship.<\u002Fp>\n            <a class=\"story-link\" href=\"#\">Read their story →<\u002Fa>\n          <\u002Farticle>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"carousel-foot\">\n        <div class=\"carousel-dots\" role=\"tablist\" aria-label=\"Story pagination\"><\u002Fdiv>\n        <div class=\"carousel-nav\">\n          <button class=\"prev\" aria-label=\"Previous stories\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"15 18 9 12 15 6\"><\u002Fpolyline><\u002Fsvg>\n          <\u002Fbutton>\n          <button class=\"next\" aria-label=\"Next stories\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 18 15 12 9 6\"><\u002Fpolyline><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========== 9b. FAQs ========== -->\n<section class=\"faq\" data-screen-label=\"08 FAQs\">\n  <div class=\"wrap\">\n    <div class=\"faq-grid\">\n      <div class=\"faq-left\">\n        <h2>Got questions?<br>We've got answers.<\u002Fh2>\n        <p class=\"lede\">Everything you need to know before getting started.<\u002Fp>\n        <div class=\"faq-help\">\n          <div class=\"title\">Still have questions?<\u002Fdiv>\n          <div class=\"sub\">Contact us and we'll help you out.<\u002Fdiv>\n          <a class=\"btn-faq\" href=\"#\">Contact support →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <ul class=\"faq-list\" id=\"faqList\">\n        <li class=\"faq-item\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"false\">\n            <span>What exactly does OppDate Apply do?<\u002Fspan>\n            <span class=\"ic\" aria-hidden=\"true\"><\u002Fspan>\n          <\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\">\n            <p>OppDate Apply is OppDate's flagship service. Once you pay for an application, our team handles everything on your behalf, collecting your documents, communicating with the institution, and submitting your full application directly. You just track the progress from your dashboard.<\u002Fp>\n          <\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n        <li class=\"faq-item open\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"true\">\n            <span>Do you actually submit my application to the institution?<\u002Fspan>\n            <span class=\"ic\" aria-hidden=\"true\"><\u002Fspan>\n          <\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\">\n            <p>Yes. OppDate submits directly to the institution using a dedicated email account set up for your application. You do not need to visit the institution's portal or fill out any forms yourself.<\u002Fp>\n          <\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n        <li class=\"faq-item\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"false\">\n            <span>What happens after I pay?<\u002Fspan>\n            <span class=\"ic\" aria-hidden=\"true\"><\u002Fspan>\n          <\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\">\n            <p>A private messaging thread opens between you and the OppDate team. We send you instructions for setting up a dedicated Gmail account for your application, collect any remaining documents, and begin processing your submission immediately.<\u002Fp>\n          <\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n        <li class=\"faq-item\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"false\">\n            <span>Is my personal information and documents safe?<\u002Fspan>\n            <span class=\"ic\" aria-hidden=\"true\"><\u002Fspan>\n          <\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\">\n            <p>Yes. All documents are encrypted at rest and in transit. Your Gmail credentials are stored with column-level encryption and accessed only by authorised team members. Your data is never shared with third parties.<\u002Fp>\n          <\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n        <li class=\"faq-item\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"false\">\n            <span>How does the AI eligibility check work?<\u002Fspan>\n            <span class=\"ic\" aria-hidden=\"true\"><\u002Fspan>\n          <\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\">\n            <p>When you click OppDate Apply, our AI reads the opportunity's eligibility requirements and asks you a short set of tailored questions. Based on your answers, it determines whether you qualify before you pay - so you never spend money on an application you are ineligible for.<\u002Fp>\n          <\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n        <li class=\"faq-item\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"false\">\n            <span>What if I'm not eligible for an opportunity?<\u002Fspan>\n            <span class=\"ic\" aria-hidden=\"true\"><\u002Fspan>\n          <\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\">\n            <p>The AI will let you know clearly and suggest alternative opportunities that better match your profile. You pay nothing if you do not proceed.<\u002Fp>\n          <\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n        <li class=\"faq-item\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"false\">\n            <span>How much does it cost to apply?<\u002Fspan>\n            <span class=\"ic\" aria-hidden=\"true\"><\u002Fspan>\n          <\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\">\n            <p>Each opportunity has its own fee, set transparently on the listing page before you commit. The fee covers OppDate's service charge and, where applicable, the institution's own application fee. No hidden charges.<\u002Fp>\n          <\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n        <li class=\"faq-item\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"false\">\n            <span>Can I reuse my documents for multiple applications?<\u002Fspan>\n            <span class=\"ic\" aria-hidden=\"true\"><\u002Fspan>\n          <\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\">\n            <p>Yes. Every document you upload is stored in your personal credential library. When you apply to a new opportunity, your existing documents are available to attach instantly, you never upload the same file twice.<\u002Fp>\n          <\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n        <li class=\"faq-item\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"false\">\n            <span>How do I track my application after submission?<\u002Fspan>\n            <span class=\"ic\" aria-hidden=\"true\"><\u002Fspan>\n          <\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\">\n            <p>Your dashboard shows a live status tracker for every application: Submitted, Under Review, Decision Pending, and Outcome. You also receive in-app and email notifications at every status change.<\u002Fp>\n          <\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n        <li class=\"faq-item\">\n          <button class=\"faq-q\" type=\"button\" aria-expanded=\"false\">\n            <span>What is the internal messaging system?<\u002Fspan>\n            <span class=\"ic\" aria-hidden=\"true\"><\u002Fspan>\n          <\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"inner\">\n            <p>After payment, a private thread opens between you and the OppDate team. This is where all communication happens: document requests, updates, clarifications, and confirmation of submission. It stays open for the full duration of your application.<\u002Fp>\n          <\u002Fdiv><\u002Fdiv>\n        <\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========== 10. Final CTA ========== -->\n<section class=\"final\" data-screen-label=\"08 Final CTA\">\n  <div class=\"wrap\">\n    <h2 class=\"h-display\">Your next big opportunity is one click away.<\u002Fh2>\n    <p class=\"lede\">Join thousands of students and professionals who let OppDate do the hard work.<\u002Fp>\n    <div class=\"ctas\">\n      <a class=\"btn btn-primary\" href=\"#\">Get started <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa>\n      <a class=\"btn btn-ghost\" href=\"#\">Browse opportunities<\u002Fa>\n    <\u002Fdiv>\n    <p class=\"fine\">No account needed to browse. Pay only when you're ready to apply.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========== 11. Footer ========== -->\n<footer class=\"footer\" data-screen-label=\"09 Footer\">\n  <div class=\"footer-card\">\n    <div class=\"footer-card-top\">\n      <div class=\"footer-brand-col\">\n        <a class=\"lockup\" href=\"#\">\n          <img class=\"mark\" src=\"410d8c19-fdc8-426d-b318-8916506730ec\" alt=\"\" style=\"object-fit: contain; width: 124px\">\n        <\u002Fa>\n        <a class=\"lockup\" href=\"#\"><span>Opp<\u002Fspan><span class=\"date\">Date<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n      <div class=\"footer-col\">\n        <h6>Platform<\u002Fh6>\n        <ul>\n          <li><a href=\"#\">Opportunities<\u002Fa><\u002Fli>\n          <li><a href=\"#\">OppDate Apply<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Mentorship<\u002Fa><\u002Fli>\n          <li><a href=\"#\">eBooks<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Consultations<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"footer-col\">\n        <h6>Company<\u002Fh6>\n        <ul>\n          <li><a href=\"#\">About<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Blog<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Careers<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Press<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"footer-col\">\n        <h6>Support<\u002Fh6>\n        <ul>\n          <li><a href=\"#\">Help centre<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Contact<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Privacy policy<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Terms of service<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"footer-col\">\n        <h6>Connect<\u002Fh6>\n        <ul>\n          <li><a href=\"#\">X / Twitter<\u002Fa><\u002Fli>\n          <li><a href=\"#\">LinkedIn<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Instagram<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Newsletter<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"footer-card-cta\">\n        <a class=\"btn btn-primary\" href=\"#\">Get started<\u002Fa>\n        <div class=\"support\"><a href=\"mailto:support@oppdate.com\">support@oppdate.com<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <hr class=\"footer-card-divider\">\n    <div class=\"footer-card-bottom\">\n      <ul class=\"footer-socials\">\n        <li><a href=\"#\" aria-label=\"X/Twitter\">\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\">\n            <path d=\"M18.244 2H21.5l-7.5 8.57L23 22h-6.844l-5.36-7.013L4.6 22H1.34l8.02-9.165L1 2h7l4.844 6.404L18.244 2Zm-2.4 18h1.86L7.26 4H5.27l10.574 16Z\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fa><\u002Fli>\n        <li><a href=\"#\" aria-label=\"LinkedIn\">\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\">\n            <path d=\"M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.95v5.66H9.36V9h3.41v1.56h.05a3.74 3.74 0 0 1 3.36-1.84c3.59 0 4.25 2.36 4.25 5.43v6.3ZM5.34 7.43A2.06 2.06 0 1 1 5.34 3.3a2.06 2.06 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.22.79 24 1.77 24h20.45C23.2 24 24 23.22 24 22.27V1.73C24 .77 23.2 0 22.22 0Z\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fa><\u002Fli>\n        <li><a href=\"#\" aria-label=\"Instagram\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n            <rect x=\"2\" y=\"2\" width=\"20\" height=\"20\" rx=\"5\" ry=\"5\"><\u002Frect>\n            <path d=\"M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z\"><\u002Fpath>\n            <line x1=\"17.5\" y1=\"6.5\" x2=\"17.51\" y2=\"6.5\"><\u002Fline>\n          <\u002Fsvg>\n        <\u002Fa><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"footer-band\">\n    <h2 class=\"footer-tagline\" style=\"font-size: 28px; opacity: 1\">Search Less. Apply Smarter. Achieve More.<\u002Fh2>\n    <form class=\"newsletter\" onsubmit=\"event.preventDefault();\">\n      <input type=\"email\" placeholder=\"Your email address\" aria-label=\"Email\">\n      <button type=\"submit\">Stay updated <span aria-hidden=\"true\">→<\u002Fspan><\u002Fbutton>\n    <\u002Fform>\n  <\u002Fdiv>\n\n  <div class=\"footer-strip\">\n    <div class=\"copy\">© 2026 OppDate. All rights reserved.<\u002Fdiv>\n    <ul class=\"legal\">\n      <li><a href=\"#\">Terms of Service<\u002Fa><\u002Fli>\n      <li><a href=\"#\">Privacy Policy<\u002Fa><\u002Fli>\n      <li><a href=\"#\">Help Centre<\u002Fa><\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  /* ============================================================\n     Build the faint world-map dot silhouette as SVG circles.\n     We pack circles into rough continent shapes, then render\n     them at low opacity in a warm grey behind the network.\n     ============================================================ */\n  (function buildWorldMap() {\n    const svg = document.querySelector('.bg-map');\n    if (!svg) return;\n\n    // Rough continent ellipses (cx, cy, rx, ry, density)\n    // viewBox is 0..100 on both axes.\n    const blobs = [\n      // North America\n      { cx: 18, cy: 32, rx: 14, ry: 12, density: 1.0 },\n      // Central America / Caribbean\n      { cx: 22, cy: 46, rx: 4,  ry: 3,  density: 0.9 },\n      // South America\n      { cx: 28, cy: 64, rx: 7,  ry: 14, density: 1.0 },\n      // Europe\n      { cx: 51, cy: 28, rx: 7,  ry: 6,  density: 1.1 },\n      // North Africa / Sahara\n      { cx: 53, cy: 44, rx: 9,  ry: 6,  density: 0.95 },\n      // Sub-Saharan Africa\n      { cx: 56, cy: 58, rx: 8,  ry: 11, density: 1.0 },\n      // Middle East\n      { cx: 62, cy: 38, rx: 5,  ry: 4,  density: 0.9 },\n      // South Asia\n      { cx: 72, cy: 44, rx: 5,  ry: 6,  density: 1.0 },\n      // East Asia\n      { cx: 80, cy: 36, rx: 9,  ry: 7,  density: 1.05 },\n      // Southeast Asia\n      { cx: 81, cy: 52, rx: 6,  ry: 4,  density: 0.95 },\n      // Oceania\n      { cx: 86, cy: 72, rx: 7,  ry: 5,  density: 1.0 },\n      // New Zealand\n      { cx: 94, cy: 78, rx: 2,  ry: 2,  density: 0.9 }\n    ];\n\n    // Grid step\n    const step = 1.6;\n    const dots = [];\n    for (let y = 8; y <= 92; y += step) {\n      for (let x = 4; x <= 96; x += step) {\n        for (const b of blobs) {\n          const nx = (x - b.cx) / b.rx;\n          const ny = (y - b.cy) / b.ry;\n          const r2 = nx*nx + ny*ny;\n          if (r2 < 1) {\n            // jitter slightly + density-based skip\n            if (Math.random() > 0.18 * b.density) continue;\n            const jitterX = (Math.random() - 0.5) * 0.6;\n            const jitterY = (Math.random() - 0.5) * 0.6;\n            dots.push({ x: x + jitterX, y: y + jitterY, r: 0.32 + Math.random() * 0.18 });\n            break;\n          }\n        }\n      }\n    }\n\n    const ns = 'http://www.w3.org/2000/svg';\n    const frag = document.createDocumentFragment();\n    for (const d of dots) {\n      const c = document.createElementNS(ns, 'circle');\n      c.setAttribute('cx', d.x);\n      c.setAttribute('cy', d.y);\n      c.setAttribute('r', d.r);\n      c.setAttribute('fill', '#C9B89D');\n      frag.appendChild(c);\n    }\n    svg.appendChild(frag);\n  })();\n\n  /* ============================================================\n     Draw connecting lines from each node to the central hub,\n     and add a second flow-path on top with animated dashes.\n     ============================================================ */\n  (function buildLines() {\n    const visual = document.getElementById('heroVisual');\n    if (!visual) return;\n    const svg = visual.querySelector('.lines');\n    const nodes = visual.querySelectorAll('.node');\n    const ns = 'http://www.w3.org/2000/svg';\n\n    // Hub is at 50,50 in viewBox %.\n    const hub = { x: 50, y: 50 };\n    nodes.forEach(node => {\n      const left = parseFloat(node.style.left);\n      const top  = parseFloat(node.style.top);\n      // gentle curve via cubic bezier - control point shifted toward center\n      const dx = hub.x - left, dy = hub.y - top;\n      const midX = (left + hub.x) / 2 + dy * 0.10;\n      const midY = (top + hub.y) / 2 - dx * 0.10;\n      const d = `M ${left} ${top} Q ${midX} ${midY} ${hub.x} ${hub.y}`;\n\n      const base = document.createElementNS(ns, 'path');\n      base.setAttribute('d', d);\n      base.setAttribute('stroke', '#C4A882');\n      base.setAttribute('stroke-width', '0.85');\n      base.setAttribute('fill', 'none');\n      base.setAttribute('opacity', '0.6');\n      svg.appendChild(base);\n\n      const flow = document.createElementNS(ns, 'path');\n      flow.setAttribute('d', d);\n      flow.setAttribute('stroke', '#A78A66');\n      flow.setAttribute('stroke-width', '1.1');\n      flow.setAttribute('fill', 'none');\n      flow.setAttribute('opacity', '0.85');\n      flow.setAttribute('class', 'flow');\n      flow.style.animationDelay = (Math.random() * -2.4) + 's';\n      svg.appendChild(flow);\n    });\n  })();\n\n  /* ============================================================\n     How-it-works step connector - dotted path through the\n     six numbered circles. Recomputed on layout changes.\n     ============================================================ */\n  (function stepConnector() {\n    const grid = document.querySelector('.steps-grid');\n    if (!grid) return;\n    const svg = grid.querySelector('svg.step-connector');\n    const nums = [...grid.querySelectorAll('.step .num')];\n    if (!svg || nums.length < 2) return;\n    const ns = 'http://www.w3.org/2000/svg';\n\n    function draw() {\n      // Clear previous\n      while (svg.firstChild) svg.removeChild(svg.firstChild);\n\n      const gridRect = grid.getBoundingClientRect();\n      svg.setAttribute('viewBox', `0 0 ${gridRect.width} ${gridRect.height}`);\n\n      const pts = nums.map(n => {\n        const r = n.getBoundingClientRect();\n        return {\n          x: r.left + r.width / 2 - gridRect.left,\n          y: r.top  + r.height / 2 - gridRect.top\n        };\n      });\n      if (pts.length < 2) return;\n\n      // Build a smooth path through every point. For each consecutive pair,\n      // pick straight-line if they're roughly on the same row, otherwise an\n      // S-curve that bows out to the right then back to the next row's start.\n      const segs = [`M ${pts[0].x} ${pts[0].y}`];\n      for (let i = 0; i < pts.length - 1; i++) {\n        const a = pts[i], b = pts[i + 1];\n        // Row wrap: x direction reverses AND we step down to a new row.\n        const wrapping = (b.x < a.x - 40) && (b.y > a.y + 20);\n        if (wrapping) {\n          const outX = a.x + 48;\n          const midY = (a.y + b.y) / 2;\n          const inX  = b.x - 48;\n          segs.push(`C ${outX} ${a.y}, ${outX} ${midY}, ${(outX + inX) / 2} ${midY}`);\n          segs.push(`C ${inX} ${midY}, ${inX} ${b.y}, ${b.x} ${b.y}`);\n        } else {\n          segs.push(`L ${b.x} ${b.y}`);\n        }\n      }\n\n      const path = document.createElementNS(ns, 'path');\n      path.setAttribute('d', segs.join(' '));\n      path.setAttribute('fill', 'none');\n      path.setAttribute('stroke', '#B5530A');\n      path.setAttribute('stroke-width', '1.5');\n      path.setAttribute('stroke-linecap', 'round');\n      path.setAttribute('stroke-dasharray', '2 7');\n      path.setAttribute('opacity', '0.45');\n      svg.appendChild(path);\n    }\n\n    draw();\n    let raf;\n    const onResize = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };\n    window.addEventListener('resize', onResize);\n    // Recompute once fonts settle (number circles may shift)\n    if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);\n  })();\n\n  /* ============================================================\n     Nav border-on-scroll\n     ============================================================ */\n  (function nav() {\n    const nav = document.getElementById('nav');\n    const onScroll = () => {\n      if (window.scrollY > 8) nav.classList.add('scrolled');\n      else nav.classList.remove('scrolled');\n    };\n    window.addEventListener('scroll', onScroll, { passive: true });\n    onScroll();\n  })();\n\n  /* ============================================================\n     Reveal-on-scroll\n     ============================================================ */\n  (function reveal() {\n    const targets = document.querySelectorAll(\n      '.section-head, .svc, .feature, .stat, .story-card'\n    );\n    targets.forEach(t => t.classList.add('reveal'));\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });\n    }, { threshold: 0.08 });\n    targets.forEach(t => io.observe(t));\n  })();\n\n  /* ============================================================\n     Mega-menu open/close with hover delay + click toggle + ESC\n     ============================================================ */\n  (function megaMenu() {\n    const hosts = document.querySelectorAll('.nav-mega-host');\n    const HOVER_OPEN_DELAY = 80;\n    const HOVER_CLOSE_DELAY = 180;\n    let openTimer, closeTimer, currentOpen = null;\n\n    function open(host) {\n      clearTimeout(closeTimer); clearTimeout(openTimer);\n      if (currentOpen && currentOpen !== host) close(currentOpen, true);\n      host.classList.add('open');\n      host.querySelector('.nav-trigger').setAttribute('aria-expanded', 'true');\n      currentOpen = host;\n    }\n    function close(host, immediate) {\n      const doClose = () => {\n        host.classList.remove('open');\n        host.querySelector('.nav-trigger').setAttribute('aria-expanded', 'false');\n        if (currentOpen === host) currentOpen = null;\n      };\n      if (immediate) doClose();\n      else { clearTimeout(closeTimer); closeTimer = setTimeout(doClose, HOVER_CLOSE_DELAY); }\n    }\n\n    hosts.forEach(host => {\n      const trigger = host.querySelector('.nav-trigger');\n      // Hover\n      host.addEventListener('mouseenter', () => {\n        clearTimeout(closeTimer);\n        clearTimeout(openTimer);\n        openTimer = setTimeout(() => open(host), HOVER_OPEN_DELAY);\n      });\n      host.addEventListener('mouseleave', () => {\n        clearTimeout(openTimer);\n        close(host);\n      });\n      // Click toggle (good for touch / keyboard)\n      trigger.addEventListener('click', (e) => {\n        e.preventDefault();\n        if (host.classList.contains('open')) close(host, true);\n        else open(host);\n      });\n      // Keyboard\n      trigger.addEventListener('keydown', (e) => {\n        if (e.key === 'Escape') { close(host, true); trigger.focus(); }\n      });\n    });\n\n    // Close on outside click\n    document.addEventListener('click', (e) => {\n      if (!e.target.closest('.nav-mega-host')) {\n        hosts.forEach(h => close(h, true));\n      }\n    });\n    // Close on scroll\n    window.addEventListener('scroll', () => {\n      hosts.forEach(h => close(h, true));\n    }, { passive: true });\n  })();\n\n  /* ============================================================\n     Stories carousel\n     ============================================================ */\n  (function storiesCarousel() {\n    const root = document.getElementById('storiesCarousel');\n    if (!root) return;\n    const viewport = root.querySelector('.carousel-viewport');\n    const track = root.querySelector('.carousel-track');\n    const cards = root.querySelectorAll('.story-card');\n    const dotsHost = root.querySelector('.carousel-dots');\n    const prev = root.querySelector('.carousel-nav .prev');\n    const next = root.querySelector('.carousel-nav .next');\n    const total = cards.length;\n    const GAP = 20;\n    let visible = 3;\n    let maxIndex = Math.max(0, total - visible);\n    let index = 0;\n    let cardStep = 0; // card width + gap, recomputed on layout\n\n    // Build dots - one per card\n    for (let i = 0; i < total; i++) {\n      const b = document.createElement('button');\n      b.type = 'button';\n      b.setAttribute('aria-label', `Go to story ${i + 1}`);\n      b.addEventListener('click', () => goTo(i));\n      dotsHost.appendChild(b);\n    }\n    const dots = dotsHost.querySelectorAll('button');\n\n    function computeVisible() {\n      const w = window.innerWidth;\n      if (w <= 600) visible = 1;\n      else if (w <= 960) visible = 2;\n      else visible = 3;\n      maxIndex = Math.max(0, total - visible);\n      if (index > maxIndex) index = maxIndex;\n    }\n\n    function measure() {\n      if (!cards[0]) return;\n      cardStep = cards[0].getBoundingClientRect().width + GAP;\n    }\n\n    function goTo(i) {\n      index = Math.max(0, Math.min(i, maxIndex));\n      render();\n    }\n    function render() {\n      measure();\n      track.style.transform = `translate3d(${-index * cardStep}px, 0, 0)`;\n      dots.forEach((d, i) => d.classList.toggle('active', i === index));\n      prev.disabled = index <= 0;\n      next.disabled = index >= maxIndex;\n    }\n\n    // Arrows\n    prev.addEventListener('click', (e) => { e.preventDefault(); goTo(index - 1); });\n    next.addEventListener('click', (e) => { e.preventDefault(); goTo(index + 1); });\n\n    // Keyboard support on the carousel root\n    root.tabIndex = -1;\n    root.addEventListener('keydown', (e) => {\n      if (e.key === 'ArrowLeft')  { e.preventDefault(); goTo(index - 1); }\n      if (e.key === 'ArrowRight') { e.preventDefault(); goTo(index + 1); }\n    });\n\n    // ---- Mouse drag (pointer events handle touch + mouse uniformly) ----\n    let isDragging = false;\n    let pointerId = null;\n    let startX = 0;\n    let dragDx = 0;\n    let baseTranslate = 0;\n\n    function onPointerDown(e) {\n      // Ignore drags initiated on buttons or links\n      if (e.target.closest('button, a')) return;\n      isDragging = true;\n      pointerId = e.pointerId;\n      startX = e.clientX;\n      dragDx = 0;\n      baseTranslate = -index * cardStep;\n      track.classList.add('dragging');\n      viewport.classList.add('dragging');\n      viewport.setPointerCapture && viewport.setPointerCapture(pointerId);\n    }\n    function onPointerMove(e) {\n      if (!isDragging) return;\n      dragDx = e.clientX - startX;\n      // Resistance at edges\n      let dx = dragDx;\n      const proposed = baseTranslate + dx;\n      const minT = -maxIndex * cardStep;\n      const maxT = 0;\n      if (proposed > maxT)  dx = (maxT - baseTranslate) + (proposed - maxT) * 0.3;\n      if (proposed < minT)  dx = (minT - baseTranslate) + (proposed - minT) * 0.3;\n      track.style.transform = `translate3d(${baseTranslate + dx}px, 0, 0)`;\n    }\n    function onPointerUp() {\n      if (!isDragging) return;\n      isDragging = false;\n      track.classList.remove('dragging');\n      viewport.classList.remove('dragging');\n      // Snap based on distance dragged relative to card width\n      const threshold = Math.max(60, cardStep * 0.18);\n      if (Math.abs(dragDx) > threshold) {\n        const dir = dragDx < 0 ? 1 : -1;\n        goTo(index + dir);\n      } else {\n        render(); // snap back\n      }\n    }\n    viewport.addEventListener('pointerdown', onPointerDown);\n    viewport.addEventListener('pointermove', onPointerMove);\n    viewport.addEventListener('pointerup', onPointerUp);\n    viewport.addEventListener('pointercancel', onPointerUp);\n    viewport.addEventListener('pointerleave', (e) => { if (isDragging) onPointerUp(e); });\n\n    // Prevent native image/text drag from interfering\n    track.addEventListener('dragstart', (e) => e.preventDefault());\n\n    // Re-render on resize and after fonts settle\n    let raf;\n    window.addEventListener('resize', () => {\n      cancelAnimationFrame(raf);\n      raf = requestAnimationFrame(() => { computeVisible(); render(); });\n    });\n    computeVisible();\n    render();\n    if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);\n  })();\n\n  /* ============================================================\n     Why-OppDate immersive showcase\n     Contained fixed-height block. Auto-rotates through 14 benefits\n     (4s each, 600ms cross-fade), loops infinitely, never pauses,\n     no manual interaction. Runs independent of scroll/visibility.\n     ============================================================ */\n  (function showcaseController() {\n    const showcase = document.getElementById('showcase');\n    if (!showcase) return;\n    const slides   = Array.from(showcase.querySelectorAll('.benefit-slide'));\n    const dotsHost = showcase.querySelector('.showcase-dots');\n    const progFill = showcase.querySelector('.showcase-progress span');\n    const N = slides.length;\n    if (!N) return;\n\n    const DURATION = 4000; // ms per benefit\n\n    // dots (display only — not interactive)\n    slides.forEach(() => dotsHost.appendChild(document.createElement('span')));\n    const dots = Array.from(dotsHost.children);\n\n    let idx = 0;\n    function show(i) {\n      slides.forEach((s, k) => s.classList.toggle('is-active', k === i));\n      dots.forEach((d, k) => d.classList.toggle('active', k === i));\n      // restart the progress bar in sync with this benefit\n      if (progFill) {\n        progFill.style.transition = 'none';\n        progFill.style.width = '0%';\n        void progFill.offsetWidth;\n        progFill.style.transition = 'width ' + DURATION + 'ms linear';\n        progFill.style.width = '100%';\n      }\n    }\n\n    show(0);\n    setInterval(() => { idx = (idx + 1) % N; show(idx); }, DURATION);\n  })();\n  (function faqAccordion() {\n    const list = document.getElementById('faqList');\n    if (!list) return;\n    list.addEventListener('click', (e) => {\n      const btn = e.target.closest('.faq-q');\n      if (!btn) return;\n      const item = btn.closest('.faq-item');\n      const isOpen = item.classList.contains('open');\n      // Close all\n      list.querySelectorAll('.faq-item').forEach(li => {\n        li.classList.remove('open');\n        const q = li.querySelector('.faq-q');\n        if (q) q.setAttribute('aria-expanded', 'false');\n      });\n      // Toggle this one\n      if (!isOpen) {\n        item.classList.add('open');\n        btn.setAttribute('aria-expanded', 'true');\n      }\n    });\n  })();\n\n  /* ============================================================\n     Mobile dropdown menu (≤960px)\n     - Hamburger opens cream panel under tinted scrim\n     - Accordion: only one section open at a time\n     - ESC + scrim click + close-X all dismiss\n     ============================================================ */\n  (function mobileMenu() {\n    const burger = document.getElementById('navBurger');\n    const menu   = document.getElementById('mMenu');\n    const navEl  = document.getElementById('nav');\n    if (!burger || !menu) return;\n\n    function syncAnchor() {\n      // Anchor the dropdown directly beneath the (sticky) navbar capsule.\n      const b = navEl ? navEl.getBoundingClientRect().bottom : 84;\n      document.documentElement.style.setProperty('--mnav-top', Math.max(0, Math.round(b)) + 'px');\n    }\n\n    function setOpen(open) {\n      if (open) syncAnchor();\n      menu.classList.toggle('open', open);\n      menu.setAttribute('aria-hidden', open ? 'false' : 'true');\n      burger.setAttribute('aria-expanded', open ? 'true' : 'false');\n      burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');\n      if (!open) collapseAll();\n    }\n\n    function collapseAll() {\n      menu.querySelectorAll('.m-menu-row[data-accordion].active').forEach(r => {\n        toggleRow(r, false);\n      });\n    }\n\n    function toggleRow(row, open) {\n      row.classList.toggle('active', open);\n      row.setAttribute('aria-expanded', open ? 'true' : 'false');\n      const plus  = row.querySelector('.icon-plus');\n      const minus = row.querySelector('.icon-minus');\n      if (plus)  plus.style.display  = open ? 'none' : '';\n      if (minus) minus.style.display = open ? '' : 'none';\n    }\n\n    burger.addEventListener('click', () => setOpen(!menu.classList.contains('open')));\n\n    // Click on scrim (the dimmed page area, not the panel) closes\n    menu.addEventListener('click', (e) => {\n      if (e.target === menu) setOpen(false);\n    });\n\n    // Keep the anchor aligned if the viewport resizes while open\n    window.addEventListener('resize', () => {\n      if (menu.classList.contains('open')) syncAnchor();\n    });\n\n    // ESC closes\n    document.addEventListener('keydown', (e) => {\n      if (e.key === 'Escape' && menu.classList.contains('open')) setOpen(false);\n    });\n\n    // Accordion rows: only one open at a time\n    menu.querySelectorAll('.m-menu-row[data-accordion]').forEach(row => {\n      row.addEventListener('click', () => {\n        const wasOpen = row.classList.contains('active');\n        collapseAll();\n        if (!wasOpen) toggleRow(row, true);\n      });\n    });\n\n    // Tapping a sublink dismisses the menu (anchor jump)\n    menu.querySelectorAll('.m-menu-sublist a, .m-menu-chips a, .m-menu-row[href], .m-menu-ctas a').forEach(a => {\n      a.addEventListener('click', () => setOpen(false));\n    });\n\n    // If the viewport grows past mobile, snap closed so desktop layout is clean\n    const mq = window.matchMedia('(min-width: 961px)');\n    mq.addEventListener('change', (e) => { if (e.matches) setOpen(false); });\n  })();\n\n  /* Render Lucide icons */\n  if (window.lucide) window.lucide.createIcons();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
